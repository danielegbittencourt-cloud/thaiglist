
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração | ThaiGList</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 15px;
  background: #fff5f8;
  color: #493744;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: 50px auto;
}

header {
  text-align: center;
  padding: 30px 15px;
  background: linear-gradient(135deg, #f8c8dc, #e6d5f5);
  border-radius: 20px;
}

header h1 {
  color: #8e4774;
  margin: 0;
}

main {
  margin-top: 20px;
  padding: 25px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 5px 20px #d9b8cc55;
}

h2 { color: #a45482; }

label {
  display: block;
  margin: 15px 0 6px;
  color: #70566a;
  font-weight: bold;
}

input, textarea, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ecc8dc;
  border-radius: 10px;
  font-size: 16px;
  font-family: Arial, sans-serif;
  background: white;
  color: #493744;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #b76b9b;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

#logout-button {
  background: #a99aaa;
}

#cancel-edit-button {
  background: #a99aaa;
}

#message {
  margin-top: 15px;
  line-height: 1.5;
  color: #854d78;
}

#dashboard[hidden],
#login-section[hidden],
#cancel-edit-button[hidden] {
  display: none;
}

.form-section {
  margin-top: 25px;
  padding-top: 15px;
  border-top: 1px solid #f0dce8;
}

.drama-item {
  padding: 15px;
  margin-top: 12px;
  border: 1px solid #ecc8dc;
  border-radius: 12px;
  background: #fffafd;
}

.drama-item h3 {
  color: #8e4774;
  margin-top: 0;
}

.drama-actions {
  display: flex;
  gap: 10px;
}

.drama-actions button {
  flex: 1;
}

.edit-button {
  background: #9875b5;
}

a {
  display: block;
  margin-top: 20px;
  text-align: center;
  color: #a45482;
  text-decoration: none;
}

footer {
  text-align: center;
  color: #987d91;
  margin-top: 20px;
}
  .delete-button {
  background: #c76b80;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>ThaiGList 🌷</h1>
  <p>Área administrativa</p>
</header>

<main>
  <section id="login-section">
    <h2>Entrar</h2>
    <p>Acesse sua conta de administradora.</p>

    <form id="login-form">
      <label for="email">E-mail</label>
      <input type="email" id="email"
        autocomplete="username" required>

      <label for="password">Senha</label>
      <input type="password" id="password"
        autocomplete="current-password" required>

      <button type="submit" id="login-button">Entrar</button>
    </form>
  </section>

  <section id="dashboard" hidden>
    <h2>Acesso autorizado! 🌷</h2>
    <p id="user-email"></p>

    <div class="form-section">
      <h2 id="form-title">Cadastrar novo drama</h2>
      <p>Preencha as informações do drama.</p>

      <form id="drama-form">

        <label for="title">Título</label>
        <input id="title" required placeholder="Ex.: 23.5">

        <label for="original_title">Título original</label>
        <input id="original_title" placeholder="Nome em tailandês">

        <label for="synopsis">Sinopse</label>
        <textarea id="synopsis"></textarea>

        <label for="year">Ano de lançamento</label>
        <input id="year" type="number" min="1900" max="2100">

        <label for="episodes">Número de episódios</label>
        <input id="episodes" type="number" min="1">

        <label for="poster_url">Link do pôster</label>
        <input id="poster_url" type="url">

        <label for="genre">Gênero</label>
        <input id="genre">

        <label for="status">Status</label>
        <select id="status">
          <option value="Quero assistir">Quero assistir</option>
          <option value="Assistindo">Assistindo</option>
          <option value="Concluída">Concluída</option>
        </select>

        <label for="country">País</label>
        <input id="country" value="Tailândia">

        <label for="main_cast">Elenco principal</label>
        <textarea id="main_cast"></textarea>

        <label for="characters">Personagens</label>
        <textarea id="characters"></textarea>

        <label for="trailer_url">Link do trailer no YouTube</label>
        <input id="trailer_url" type="url">

        <button type="submit" id="save-button">
          Salvar drama 🌷
        </button>

        <button type="button" id="cancel-edit-button" hidden>
          Cancelar edição
        </button>
      </form>
    </div>

    <div class="form-section">
      <h2>Gerenciar dramas 🌸</h2>
      <p>Consulte e organize os títulos do catálogo.</p>
      <div id="drama-list">Carregando dramas...</div>
    </div>

    <button type="button" id="logout-button">
      Sair da conta
    </button>
  </section>

  <p id="message" role="status"></p>
  <a href="index.html">← Voltar ao catálogo</a>
</main>

<footer>ThaiGList © 2026</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://jjybnidhwfimcdwygafk.supabase.co";
const SUPABASE_KEY = "sb_publishable_DyikY0WSJJ4apDc0_ZwfOw_x6LvfqM-";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginSection = document.getElementById("login-section");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const loginForm = document.getElementById("login-form");
const loginButton = document.getElementById("login-button");
const dramaForm = document.getElementById("drama-form");
const saveButton = document.getElementById("save-button");
const cancelButton = document.getElementById("cancel-edit-button");

let editingId = null;

const fields = [
  "title",
  "original_title",
  "synopsis",
  "year",
  "episodes",
  "poster_url",
  "genre",
  "status",
  "country",
  "main_cast",
  "characters",
  "trailer_url"
];

function showSession(session) {
  if (session) {
    loginSection.hidden = true;
    dashboard.hidden = false;
    document.getElementById("user-email").textContent =
      "Conta: " + (session.user.email || "");
    loadDramas();
  } else {
    loginSection.hidden = false;
    dashboard.hidden = true;
    resetForm();
  }
}

function resetForm() {
  editingId = null;
  dramaForm.reset();

  document.getElementById("country").value = "Tailândia";
  document.getElementById("form-title").textContent =
    "Cadastrar novo drama";

  saveButton.textContent = "Salvar drama 🌷";
  cancelButton.hidden = true;
}


async function loadDramas() {
  const dramaList = document.getElementById("drama-list");
  dramaList.textContent = "Carregando dramas...";

  const { data, error } = await db
    .from("dramas")
    .select("id, title, year, status")
    .order("id", { ascending: false });

  if (error) {
    console.error(error);
    dramaList.textContent = "Não foi possível carregar os dramas.";
    return;
  }

  dramaList.innerHTML = "";

  if (!data || data.length === 0) {
    dramaList.textContent = "Nenhum drama cadastrado ainda.";
    return;
  }

  data.forEach((drama) => {
    const item = document.createElement("div");
    item.className = "drama-item";

    const title = document.createElement("h3");
    title.textContent = drama.title;

    const info = document.createElement("p");
    info.textContent =
      (drama.year || "Ano não informado") +
      " · " +
      (drama.status || "Sem status");

    const actions = document.createElement("div");
    actions.className = "drama-actions";

    // Botão Editar
    const editButton = document.createElement("button");
    editButton.type = "button";
    editButton.className = "edit-button";
    editButton.textContent = "✏️ Editar";

    editButton.addEventListener("click", () => {
      editDrama(drama.id);
    });

    // Botão Excluir
    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "delete-button";
    deleteButton.textContent = "🗑️ Excluir";

    deleteButton.addEventListener("click", () => {
      deleteDrama(drama.id);
    });

    actions.appendChild(editButton);
    actions.appendChild(deleteButton);

    item.appendChild(title);
    item.appendChild(info);
    item.appendChild(actions);

    dramaList.appendChild(item);
  });
}

// Função para excluir um drama
async function deleteDrama(id) {
  const confirmed = confirm(
    "Tem certeza de que deseja excluir este drama?"
  );

  if (!confirmed) return;

  const { data: sessionData } = await db.auth.getSession();

  if (!sessionData.session) {
    alert("Você precisa estar conectada para excluir.");
    return;
  }

  const { error } = await db
    .from("dramas")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Não foi possível excluir: " + error.message);
    return;
  }

  alert("Drama excluído com sucesso! 🌷");
  loadDramas();
}

  async function editDrama(id) {
  message.textContent = "Carregando informações...";

  const { data, error } = await db
    .from("dramas")
    .select("*")
    .eq("id", id)
    .single();

  if (error || !data) {
    console.error(error);
    message.textContent = "Não foi possível abrir esse drama.";
    return;
  }

  editingId = id;

  fields.forEach((field) => {
    const input = document.getElementById(field);
    input.value = data[field] ?? "";
  });

  document.getElementById("form-title").textContent =
    "Editando: " + data.title;

  saveButton.textContent = "Salvar alterações 🌷";
  cancelButton.hidden = false;

  document.getElementById("form-title").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

  message.textContent = "Edite as informações e salve as alterações.";
}

async function checkSession() {
  const { data, error } = await db.auth.getSession();

  if (error) {
    message.textContent = "Não foi possível verificar o acesso.";
    return;
  }

  showSession(data.session);
}

loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  loginButton.disabled = true;
  loginButton.textContent = "Entrando...";
  message.textContent = "";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  loginButton.disabled = false;
  loginButton.textContent = "Entrar";

  if (error) {
    message.textContent =
      "Não foi possível entrar. Confira seu e-mail e sua senha.";
    return;
  }

  loginForm.reset();
  showSession(data.session);
  message.textContent = "Login realizado com sucesso!";
});

dramaForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  saveButton.disabled = true;
  saveButton.textContent = "Salvando...";
  message.textContent = "";

  const { data: sessionData, error: sessionError } =
    await db.auth.getSession();

  if (sessionError || !sessionData.session) {
    message.textContent = "Sua sessão expirou. Entre novamente.";
    showSession(null);
    saveButton.disabled = false;
    return;
  }

  function getText(id) {
    const value = document.getElementById(id).value.trim();
    return value || null;
  }

  function getNumber(id) {
    const value = document.getElementById(id).value;
    return value === "" ? null : Number(value);
  }

  const dramaData = {
    title: getText("title"),
    original_title: getText("original_title"),
    synopsis: getText("synopsis"),
    year: getNumber("year"),
    episodes: getNumber("episodes"),
    poster_url: getText("poster_url"),
    genre: getText("genre"),
    status: getText("status"),
    country: getText("country"),
    main_cast: getText("main_cast"),
    characters: getText("characters"),
    trailer_url: getText("trailer_url")
  };

  let result;

  if (editingId !== null) {
    result = await db
      .from("dramas")
      .update(dramaData)
      .eq("id", editingId);
  } else {
    result = await db
      .from("dramas")
      .insert([dramaData]);
  }

  saveButton.disabled = false;

  if (result.error) {
    console.error(result.error);
    message.textContent =
      "Não foi possível salvar. Verifique as permissões e os dados.";
    saveButton.textContent =
      editingId !== null ? "Salvar alterações 🌷" : "Salvar drama 🌷";
    return;
  }

  const wasEditing = editingId !== null;

  resetForm();
  message.textContent = wasEditing
    ? "Drama atualizado com sucesso! 🌷"
    : "Drama cadastrado com sucesso! 🌷";

  loadDramas();
});

cancelButton.addEventListener("click", () => {
  resetForm();
  message.textContent = "Edição cancelada.";
});

document.getElementById("logout-button").addEventListener("click", async () => {
  const { error } = await db.auth.signOut();

  if (error) {
    message.textContent = "Não foi possível sair da conta.";
    return;
  }

  showSession(null);
  message.textContent = "Você saiu da sua conta.";
});

db.auth.onAuthStateChange((_event, session) => {
  showSession(session);
});

checkSession();
</script>

</body>
</html>
