
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalhes do drama | ThaiGList</title>

</head>

<style>
* {
  box-sizing: border-box;
}

:root {
  --background: #100d18;
  --surface: #1b1626;
  --surface-light: #241d32;
  --pink: #f05ba8;
  --purple: #a875f5;
  --text: #f7efff;
  --muted: #b8a9c9;
  --border: #382b49;
}

body {
  margin: 0;
  padding: 25px 15px;
  background: var(--background);
  color: var(--text);
  font-family: Arial, sans-serif;
}

.container {
  max-width: 1000px;
  margin: auto;
}

/* CABEÇALHO */

header {
  text-align: center;
  padding: 35px 20px;
  background: linear-gradient(120deg, #21132f, #392047);
  border: 1px solid #71428c;
  border-radius: 20px;
  box-shadow: 0 8px 30px #00000044;
}

header h1 {
  color: white;
  margin: 0;
  font-size: 32px;
}

/* CONTEÚDO */

main {
  margin-top: 25px;
  padding: 30px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: 0 8px 30px #00000033;
}

/* VOLTAR */

.back {
  display: inline-block;
  margin-bottom: 25px;
  color: var(--pink);
  font-weight: bold;
  text-decoration: none;
}

.back:hover {
  color: var(--purple);
}

/* DETALHES */

.details {
  display: flex;
  gap: 30px;
  flex-wrap: wrap;
}

.poster {
  width: 280px;
  max-width: 100%;
  border-radius: 14px;
  object-fit: cover;
  align-self: flex-start;
  border: 1px solid #71428c;
  box-shadow: 0 8px 25px #00000066;
}

.information {
  flex: 1;
  min-width: 220px;
}

h2 {
  color: var(--pink);
  font-size: 28px;
}

.original-title {
  color: var(--muted);
  font-style: italic;
}

p {
  color: #d0c3dc;
  line-height: 1.7;
}

/* STATUS */

.status {
  display: inline-block;
  padding: 8px 13px;
  border-radius: 20px;
  background: #452b52;
  color: #f4b6dc;
  font-size: 13px;
  font-weight: bold;
}

/* SINOPSE */

.synopsis {
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

/* ELENCO E PERSONAGENS */

h3 {
  color: var(--purple);
}

/* TRAILER */

iframe {
  max-width: 100%;
  border-radius: 14px;
  border: 1px solid var(--border);
}

/* RODAPÉ */

footer {
  text-align: center;
  padding: 20px;
  color: var(--muted);
}

/* CELULAR */

@media (max-width: 600px) {
  body {
    padding: 15px 10px;
  }

  main {
    padding: 20px;
  }

  .details {
    flex-direction: column;
    align-items: center;
  }

  .poster {
    width: 100%;
    max-width: 280px;
  }

  .information {
    width: 100%;
  }

  header h1 {
    font-size: 26px;
  }

  h2 {
    font-size: 24px;
  }
}
  
.my-list-controls {
  margin-top: 28px;
  padding: 22px;
  background: #1b1626;
  border: 1px solid #382b49;
  border-radius: 16px;
}

.my-list-controls h3 {
  color: #f05ba8;
  margin-top: 0;
  margin-bottom: 18px;
}

.list-status-options {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin: 15px 0;
}

.list-status-options button {
  padding: 11px 15px;
  border-radius: 10px;
  border: 1px solid #493956;
  background: #241d32;
  color: #f7efff;
  cursor: pointer;
  transition: 0.2s;
}

.list-status-options button.active {
  background: linear-gradient(135deg, #f05ba8, #a875f5);
  border-color: transparent;
  color: white;
}

.rating-area {
  margin: 20px 0;
}

.rating-stars {
  display: flex;
  gap: 7px;
  margin-top: 10px;
}

.rating-stars button {
  background: transparent;
  border: none;
  color: #f5bd54;
  font-size: 30px;
  cursor: pointer;
  padding: 2px;
}

.save-list-button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #f05ba8, #a875f5);
  color: white;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
  margin-top: 12px;
}

.save-list-button:disabled {
  opacity: 0.6;
  cursor: wait;
}

.list-message {
  color: #f05ba8;
  margin-bottom: 0;
}

.my-list-controls [hidden] {
  display: none !important;
}

</style>

<body>
<div class="container">

<header>
  <h1>ThaiGList 🌷</h1>
  <p>Detalhes da série</p>
</header>

<main>
  <a class="back" href="index.html">← Voltar ao catálogo</a>

  <div id="details">
    <p>Carregando informações... 🌷</p>
  </div>
</main>

<footer>ThaiGList © 2026</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://jjybnidhwfimcdwygafk.supabase.co";
const SUPABASE_KEY = "sb_publishable_DyikY0WSJJ4apDc0_ZwfOw_x6LvfqM-";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const details = document.getElementById("details");

function addText(parent, tag, className, value) {
  const element = document.createElement(tag);
  element.className = className;
  element.textContent = value;
  parent.appendChild(element);
  return element;
}

async function loadDrama() {
  const id = new URLSearchParams(window.location.search).get("id");

  if (!id) {
    details.textContent = "Série não encontrada.";
    return;
  }

  const { data, error } = await db
    .from("dramas")
    .select("*")
    .eq("id", id)
    .single();

  if (error || !data) {
    details.textContent = "Não foi possível carregar esta série.";
    console.error(error);
    return;
  }

  details.innerHTML = "";

  const layout = document.createElement("div");
  layout.className = "details";

  if (data.poster_url) {
    const image = document.createElement("img");
    image.className = "poster";
    image.src = data.poster_url;
    image.alt = "Pôster de " + (data.title || "drama");
    image.onerror = () => {
      image.remove();
    };
    layout.appendChild(image);
  }

  const info = document.createElement("div");
  info.className = "information";

  addText(info, "h2", "", data.title || "Sem título");

  if (data.original_title) {
    addText(info, "p", "original-title", data.original_title);
  }

  if (data.year) addText(info, "p", "", "Ano: " + data.year);
  if (data.country) addText(info, "p", "", "País: " + data.country);
  if (data.episodes) addText(info, "p", "", "Episódios: " + data.episodes);
  if (data.genre) addText(info, "p", "", "Gênero: " + data.genre);


  layout.appendChild(info);
  

  // Minha Lista: controles visuais
  const listSection = document.createElement("section");
  listSection.className = "my-list-controls";

  addText(listSection, "h3", "", "Minha Lista 🌷");

  const { data: sessionData } = await db.auth.getSession();
  const session = sessionData.session;

  if (!session) {
    addText(
      listSection,
      "p",
      "",
      "Entre na sua conta para adicionar este drama à sua lista."
    );

    const loginLink = document.createElement("a");
    loginLink.href = "conta.html";
    loginLink.textContent = "Entrar / Cadastrar";
    listSection.appendChild(loginLink);

  } else {
    const userId = session.user.id;

    let selectedStatus = "want_to_watch";
    let selectedRating = 0;

    const statusOptions = document.createElement("div");
    statusOptions.className = "list-status-options";

    const statuses = [
      { value: "want_to_watch", label: "♡ Quero assistir" },
      { value: "watching", label: "▶ Assistindo" },
      { value: "completed", label: "✓ Concluído" }
    ];

    const statusButtons = [];

    statuses.forEach(status => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = status.label;

      button.addEventListener("click", () => {
        selectedStatus = status.value;

        statusButtons.forEach(item => {
          item.classList.toggle("active", item === button);
        });

        ratingArea.hidden = selectedStatus !== "completed";

        if (selectedStatus !== "completed") {
          selectedRating = 0;
          updateStars();
        }
      });

      statusButtons.push(button);
      statusOptions.appendChild(button);
    });

    const ratingArea = document.createElement("div");
    ratingArea.className = "rating-area";
    ratingArea.hidden = true;

    addText(ratingArea, "p", "", "Sua avaliação");

    const stars = document.createElement("div");
    stars.className = "rating-stars";

    const starButtons = [];

    function updateStars() {
      starButtons.forEach((button, index) => {
        button.textContent =
          index < selectedRating ? "★" : "☆";
      });
    }

    for (let i = 1; i <= 5; i++) {
      const star = document.createElement("button");
      star.type = "button";
      star.textContent = "☆";
      star.setAttribute("aria-label", i + " estrelas");

      star.addEventListener("click", () => {
        selectedRating = i;
        updateStars();
      });

      starButtons.push(star);
      stars.appendChild(star);
    }

    ratingArea.appendChild(stars);

    const saveButton = document.createElement("button");
    saveButton.type = "button";
    saveButton.className = "save-list-button";
    saveButton.textContent = "＋ Salvar na Minha Lista";

    const message = document.createElement("p");
    message.className = "list-message";

    // Recupera os dados já salvos
    const { data: existing, error: readError } = await db
      .from("user_drama_list")
      .select("status, rating")
      .eq("user_id", userId)
      .eq("drama_id", data.id)
      .maybeSingle();

    if (readError) {
      console.error("Erro ao consultar Minha Lista:", readError);
      message.textContent = "Não foi possível consultar sua lista.";
    }

    if (existing) {
      selectedStatus = existing.status;
      selectedRating = existing.rating || 0;

      saveButton.textContent = "✓ Atualizar Minha Lista";
    }

    statusButtons.forEach((button, index) => {
      button.classList.toggle(
        "active",
        statuses[index].value === selectedStatus
      );
    });

    ratingArea.hidden = selectedStatus !== "completed";
    updateStars();

    saveButton.addEventListener("click", async () => {
      saveButton.disabled = true;
      saveButton.textContent = "Salvando...";

      message.textContent = "";

      const { error } = await db
        .from("user_drama_list")
        .upsert(
          {
            user_id: userId,
            drama_id: data.id,
            status: selectedStatus,
            rating:
              selectedStatus === "completed" && selectedRating
                ? selectedRating
                : null,
            updated_at: new Date().toISOString()
          },
          {
            onConflict: "user_id,drama_id"
          }
        );

      saveButton.disabled = false;
      saveButton.textContent = "✓ Atualizar Minha Lista";

      if (error) {
        console.error("Erro ao salvar:", error);
        message.textContent =
          "Não foi possível salvar. Tente novamente.";
        return;
      }

      message.textContent = "Drama salvo na sua lista! 🌷";
    });

    listSection.append(
      statusOptions,
      ratingArea,
      saveButton,
      message
    );
  }

  info.appendChild(listSection);


  details.appendChild(layout);
  
  if (data.trailer_url) {
    const trailerSection = document.createElement("section");
    trailerSection.className = "synopsis";

    addText(trailerSection, "h2", "", "Trailer oficial");

    const video = document.createElement("iframe");

    const videoId = data.trailer_url.match(
      /(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/
    );

    if (videoId) {
      video.src = "https://www.youtube.com/embed/" + videoId[1];
      video.title = "Trailer de " + data.title;
      video.width = "100%";
      video.height = "315";
      video.style.border = "0";
      video.style.borderRadius = "14px";
      video.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      video.allowFullscreen = true;

      trailerSection.appendChild(video);
      details.appendChild(trailerSection);
    }
  }

  
  if (data.main_cast) {
    const castSection = document.createElement("section");
    castSection.className = "synopsis";

    addText(castSection, "h2", "", "Elenco principal");

    const castText = addText(
      castSection, "p", "", data.main_cast
    );
    castText.style.whiteSpace = "pre-line";

    details.appendChild(castSection);
  }

  if (data.characters) {
    const charactersSection = document.createElement("section");
    charactersSection.className = "synopsis";

    addText(charactersSection, "h2", "", "Personagens");

    const charactersText = addText(
      charactersSection, "p", "", data.characters
    );
    charactersText.style.whiteSpace = "pre-line";

    details.appendChild(charactersSection);
  }


  if (data.synopsis) {
    const synopsis = document.createElement("section");
    synopsis.className = "synopsis";
    addText(synopsis, "h2", "", "Sinopse");
    addText(synopsis, "p", "", data.synopsis);
    details.appendChild(synopsis);
  }
}

loadDrama();
</script>

</body>
</html>
