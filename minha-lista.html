
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Lista | ThaiGList</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --background: #100d18;
      --surface: #1b1626;
      --pink: #f05ba8;
      --purple: #a875f5;
      --text: #f7efff;
      --muted: #b8a9c9;
      --border: #382b49;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    header {
      max-width: 1100px;
      margin: 0 auto 35px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    h1 {
      color: var(--pink);
      margin: 0;
    }

    a {
      color: var(--text);
      text-decoration: none;
    }

    .back {
      background: var(--surface);
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    main {
      max-width: 1100px;
      margin: auto;
    }

    .welcome {
      margin-bottom: 25px;
      color: var(--muted);
    }

    .tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .tabs button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    .tabs button.active {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      border: none;
      color: white;
    }

    #drama-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 20px;
    }

    .drama-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .drama-card img {
      width: 100%;
      height: 245px;
      object-fit: cover;
      display: block;
    }

    .drama-info {
      padding: 13px;
    }

    .drama-info h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .empty {
      color: var(--muted);
      padding: 25px 0;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="top">
    <h1>ThaiGList 🌷</h1>
    <a class="back" href="index.html">← Voltar ao catálogo</a>
  </div>
</header>

<main>
  <h2>Minha Lista</h2>
  <p class="welcome" id="welcome">Sua coleção pessoal de dramas.</p>

  <div class="tabs">
    <button class="active" data-status="want_to_watch">Quero assistir</button>
    <button data-status="watching">Assistindo</button>
    <button data-status="completed">Concluídos</button>
  </div>

  <div id="drama-list">
    <p class="empty">Carregando sua lista... 🌷</p>
  </div>
</main>

<script>
  const SUPABASE_URL = "https://jjybnidhwfimcdwygafk.supabase.co";
  const SUPABASE_KEY = "sb_publishable_DyikY0WSJJ4apDc0_ZwfOw_x6LvfqM-";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let currentStatus = "want_to_watch";
  let userId = null;

  const dramaList = document.getElementById("drama-list");

  async function startPage() {
    const { data, error } = await db.auth.getSession();

    if (error || !data.session) {
      window.location.href = "conta.html";
      return;
    }

    userId = data.session.user.id;

    const email = data.session.user.email || "";
    document.getElementById("welcome").textContent =
      "Olá, " + email.split("@")[0] + "! Esta é sua coleção pessoal. 🌷";

    loadMyList();
  }

  async function loadMyList() {
    dramaList.innerHTML =
      '<p class="empty">Carregando... 🌷</p>';

    const { data, error } = await db
      .from("user_drama_list")
      .select(`
        id,
        status,
        rating,
        dramas (
          id,
          title,
          poster_url
        )
      `)
      .eq("user_id", userId)
      .eq("status", currentStatus);

    if (error) {
      console.error("Erro ao carregar lista:", error);
      dramaList.innerHTML =
        '<p class="empty">Não foi possível carregar sua lista.</p>';
      return;
    }

    dramaList.innerHTML = "";

    if (!data || data.length === 0) {
      dramaList.innerHTML =
        '<p class="empty">Nenhum drama nesta categoria ainda. 🌷</p>';
      return;
    }

    data.forEach(item => {
      if (!item.dramas) return;

      const card = document.createElement("article");
      card.className = "drama-card";

      if (item.dramas.poster_url) {
        const image = document.createElement("img");
        image.src = item.dramas.poster_url;
        image.alt = "Pôster de " + item.dramas.title;
        card.appendChild(image);
      }

      const info = document.createElement("div");
      info.className = "drama-info";

      const title = document.createElement("h3");
      title.textContent = item.dramas.title;

      info.appendChild(title);

      if (item.status === "completed" && item.rating) {
        const rating = document.createElement("p");
        rating.textContent = "⭐".repeat(item.rating);
        info.appendChild(rating);
      }

      card.appendChild(info);

      card.addEventListener("click", () => {
        window.location.href =
          "drama.html?id=" + encodeURIComponent(item.dramas.id);
      });

      dramaList.appendChild(card);
    });
  }

  document.querySelectorAll(".tabs button").forEach(button => {
    button.addEventListener("click", () => {
      document.querySelector(".tabs button.active")
        .classList.remove("active");

      button.classList.add("active");
      currentStatus = button.dataset.status;
      loadMyList();
    });
  });

  startPage();
</script>

</body>
</html>
