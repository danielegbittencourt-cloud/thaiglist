<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Lista | ThaiGList 🌷</title>

<style>
*,
*::before,
*::after {
  box-sizing: border-box;
}

:root {
  --background: #100d18;
  --surface: #1b1626;
  --surface-light: #241d32;
  --surface-hover: #2c233d;
  --pink: #f05ba8;
  --purple: #a875f5;
  --text: #f7efff;
  --muted: #b8a9c9;
  --border: #382b49;
}

body {
  margin: 0;
  padding: 20px 15px;
  background: var(--background);
  color: var(--text);
  font-family: Arial, sans-serif;
}

.container {
  max-width: 1120px;
  margin: auto;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
  padding: 18px 22px;
  background: linear-gradient(120deg, #1d1329, #2b1938);
  border: 1px solid #49335c;
  border-radius: 16px;
  box-shadow: 0 6px 20px #00000038;
}

header h1 {
  margin: 0;
  font-size: 24px;
  color: #ffffff;
}

.header-nav {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.nav-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: bold;
  text-decoration: none;
  color: var(--text);
  background: rgba(36, 29, 50, 0.9);
  border: 1px solid #493956;
  transition: transform 0.15s, border-color 0.15s, background 0.15s;
}

.nav-pill:hover {
  border-color: var(--purple);
  transform: translateY(-1px);
}

.nav-pill-primary {
  color: #ffffff;
  background: linear-gradient(120deg, rgba(240, 91, 168, 0.28), rgba(168, 117, 245, 0.28));
  border: 1px solid rgba(240, 91, 168, 0.55);
}

.nav-pill-primary:hover {
  background: linear-gradient(120deg, var(--pink), var(--purple));
  border-color: transparent;
}

main {
  margin-top: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 26px;
  box-shadow: 0 8px 30px #00000033;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.status-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.status-tab {
  padding: 9px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface-light);
  color: var(--muted);
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.18s;
}

.status-tab:hover {
  color: #ffffff;
  border-color: var(--purple);
}

.status-tab.active {
  background: linear-gradient(100deg, var(--pink), var(--purple));
  border-color: transparent;
  color: #ffffff;
}

.view-switcher {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.view-btn {
  padding: 8px 13px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-light);
  color: var(--muted);
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

.view-btn.active {
  background: linear-gradient(100deg, var(--pink), var(--purple));
  border-color: transparent;
  color: #ffffff;
}

/* MODO CARDS */
#list-container.view-cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 20px;
}

#list-container.view-cards .drama-card {
  position: relative;
  aspect-ratio: 2 / 3;
  border-radius: 16px;
  overflow: hidden;
  background: var(--surface-light);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

#list-container.view-cards .drama-card:hover {
  transform: translateY(-4px);
  border-color: var(--pink);
  box-shadow: 0 8px 24px rgba(240, 91, 168, 0.18);
}

#list-container.view-cards .drama-poster {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

#list-container.view-cards .drama-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 14px;
  background: linear-gradient(
    to bottom,
    transparent 35%,
    rgba(16, 13, 24, 0.85) 70%,
    rgba(16, 13, 24, 0.98) 100%
  );
}

#list-container.view-cards .drama-title {
  margin: 0 0 4px;
  font-size: 14.5px;
  color: #ffffff;
}

#list-container.view-cards .drama-meta {
  font-size: 11.5px;
  color: var(--muted);
  margin-bottom: 10px;
}

/* MODO LISTA */
#list-container.view-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

#list-container.view-list .drama-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 16px;
  border-radius: 14px;
  background: var(--surface-light);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
}

#list-container.view-list .drama-card:hover {
  border-color: var(--pink);
  background: var(--surface-hover);
  transform: translateX(2px);
}

#list-container.view-list .drama-left {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: 1;
  min-width: 0;
}

#list-container.view-list .drama-poster {
  width: 52px;
  height: 76px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
}

#list-container.view-list .drama-overlay {
  min-width: 0;
  flex: 1;
}

#list-container.view-list .drama-title {
  margin: 0 0 4px;
  font-size: 15.5px;
  color: #ffffff;
}

#list-container.view-list .drama-meta {
  font-size: 12.5px;
  color: var(--muted);
}

.card-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.status-select {
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid #493956;
  background: #171222;
  color: #ffffff;
  font-size: 12px;
  cursor: pointer;
}

.remove-btn {
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid rgba(255, 92, 138, 0.45);
  background: rgba(255, 92, 138, 0.14);
  color: #ffa6c0;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
}

.remove-btn:hover {
  background: rgba(255, 92, 138, 0.28);
}

/* MODO TABELA */
.list-table-wrap {
  width: 100%;
  overflow-x: auto;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--surface-light);
}

table.list-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 14px;
}

table.list-table thead {
  background: #171222;
  color: var(--muted);
  font-size: 12px;
  text-transform: uppercase;
}

table.list-table th,
table.list-table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

table.list-table tbody tr.clickable-row {
  cursor: pointer;
  transition: background 0.16s ease;
}

table.list-table tbody tr.clickable-row:hover {
  background: var(--surface-hover);
}

table.list-table tbody tr:last-child td {
  border-bottom: none;
}

.table-thumb {
  width: 42px;
  height: 60px;
  border-radius: 6px;
  object-fit: cover;
  display: block;
}

.table-title-text {
  color: #ffffff;
  font-weight: bold;
}

table.list-table tbody tr.clickable-row:hover .table-title-text {
  color: #ff9dd0;
  text-decoration: underline;
}

footer {
  text-align: center;
  padding: 22px;
  color: var(--muted);
  font-size: 13px;
}

[hidden] {
  display: none !important;
}

@media (max-width: 900px) {
  #list-container.view-cards {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 600px) {
  #list-container.view-cards {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  #list-container.view-list .drama-card {
    flex-direction: column;
    align-items: stretch;
  }
}
</style>
</head>

<body>

<div class="container">

  <header>
    <h1>Minha Lista 🌷</h1>
    <nav class="header-nav">
      <a class="nav-pill nav-pill-secondary" href="index.html">← Catálogo</a>
      <a class="nav-pill nav-pill-primary" href="conta.html">Minha Conta</a>
    </nav>
  </header>

  <main>

    <div id="not-logged" hidden>
      <p>Entre na sua conta para ver e gerenciar sua lista de dramas.</p>
      <a class="nav-pill nav-pill-primary" href="conta.html">Ir para Minha Conta →</a>
    </div>

    <div id="list-content" hidden>
      <div class="toolbar">
        <div class="status-tabs" id="status-tabs">
          <button type="button" class="status-tab active" data-status="all">Todos</button>
          <button type="button" class="status-tab" data-status="want_to_watch">♡ Quero assistir</button>
          <button type="button" class="status-tab" data-status="watching">▶ Assistindo</button>
          <button type="button" class="status-tab" data-status="completed">✓ Concluído</button>
        </div>

        <div class="view-switcher" id="view-switcher">
          <button type="button" class="view-btn active" data-view="cards">⊞ Cards</button>
          <button type="button" class="view-btn" data-view="list">☰ Lista</button>
          <button type="button" class="view-btn" data-view="table">▤ Tabela</button>
        </div>
      </div>

      <div id="list-container" class="view-cards">
        <p>Carregando sua lista... 🌷</p>
      </div>
    </div>

  </main>

  <footer>
    ThaiGList © 2026
  </footer>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://jjybnidhwfimcdwygafk.supabase.co";
const SUPABASE_KEY = "sb_publishable_DyikY0WSJJ4apDc0_ZwfOw_x6LvfqM-";

const memoryStorage = new Map();
const safeStorage = {
  getItem: (key) => { try { return window.localStorage.getItem(key); } catch { return memoryStorage.get(key) ?? null; } },
  setItem: (key, value) => { try { window.localStorage.setItem(key, value); } catch { memoryStorage.set(key, value); } },
  removeItem: (key) => { try { window.localStorage.removeItem(key); } catch { memoryStorage.delete(key); } }
};

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { storage: safeStorage, persistSession: true, autoRefreshToken: true }
});

const params = new URLSearchParams(window.location.search);
let activeStatus = params.get("status") || "all";
let activeView = "cards";
let currentUser = null;
let myEntries = [];

const container = document.getElementById("list-container");

function goToDrama(dramaId) {
  window.location.href = "drama.html?id=" + encodeURIComponent(dramaId);
}

function attachKeyboardOpen(el, dramaId) {
  el.tabIndex = 0;
  el.setAttribute("role", "link");
  el.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      goToDrama(dramaId);
    }
  });
}

function buildRowControls(entry) {
  const wrap = document.createElement("div");
  wrap.className = "card-controls";

  // Impede que mexer no status ou remover abra a página do drama
  const stopBubble = (e) => e.stopPropagation();
  wrap.addEventListener("click", stopBubble);
  wrap.addEventListener("keydown", stopBubble);

  const select = document.createElement("select");
  select.className = "status-select";
  [
    { value: "want_to_watch", label: "♡ Quero assistir" },
    { value: "watching", label: "▶ Assistindo" },
    { value: "completed", label: "✓ Concluído" }
  ].forEach(opt => {
    const o = document.createElement("option");
    o.value = opt.value;
    o.textContent = opt.label;
    o.selected = entry.status === opt.value;
    select.appendChild(o);
  });

  select.addEventListener("change", async () => {
    const newStatus = select.value;
    const { error } = await db
      .from("user_drama_list")
      .update({ status: newStatus, updated_at: new Date().toISOString() })
      .eq("id", entry.id);

    if (!error) {
      entry.status = newStatus;
      renderMyList();
    }
  });

  const removeBtn = document.createElement("button");
  removeBtn.type = "button";
  removeBtn.className = "remove-btn";
  removeBtn.textContent = "Remover";

  removeBtn.addEventListener("click", async () => {
    const { error } = await db
      .from("user_drama_list")
      .delete()
      .eq("id", entry.id);

    if (!error) {
      myEntries = myEntries.filter(item => item.id !== entry.id);
      renderMyList();
    }
  });

  wrap.append(select, removeBtn);
  return wrap;
}

function renderMyList() {
  container.innerHTML = "";

  const filtered = activeStatus === "all"
    ? myEntries
    : myEntries.filter(item => item.status === activeStatus);

  if (!filtered.length) {
    container.className = "view-cards";
    const p = document.createElement("p");
    p.style.color = "var(--muted)";
    p.textContent = "Nenhum drama encontrado nesta categoria 🌷";
    container.appendChild(p);
    return;
  }

  // MODO TABELA: linha inteira clicável
  if (activeView === "table") {
    container.className = "";
    const wrap = document.createElement("div");
    wrap.className = "list-table-wrap";

    const table = document.createElement("table");
    table.className = "list-table";
    table.innerHTML = `
      <thead>
        <tr>
          <th>Capa</th>
          <th>Título</th>
          <th>Ano</th>
          <th>Situação na lista</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;

    const tbody = table.querySelector("tbody");

    filtered.forEach(entry => {
      const d = entry.dramas || {};
      const tr = document.createElement("tr");
      tr.className = "clickable-row";
      tr.title = `Abrir detalhes de ${d.title || "drama"}`;
      tr.addEventListener("click", () => goToDrama(entry.drama_id));
      attachKeyboardOpen(tr, entry.drama_id);

      const tdImg = document.createElement("td");
      if (d.poster_url) {
        const img = document.createElement("img");
        img.className = "table-thumb";
        img.src = d.poster_url;
        img.alt = d.title || "Capa";
        img.loading = "lazy";
        tdImg.appendChild(img);
      } else {
        tdImg.textContent = "🌷";
      }

      const tdTitle = document.createElement("td");
      const titleSpan = document.createElement("span");
      titleSpan.className = "table-title-text";
      titleSpan.textContent = d.title || "Sem título";
      tdTitle.appendChild(titleSpan);

      const tdYear = document.createElement("td");
      tdYear.textContent = d.year || "—";

      const tdActions = document.createElement("td");
      tdActions.appendChild(buildRowControls(entry));

      tr.append(tdImg, tdTitle, tdYear, tdActions);
      tbody.appendChild(tr);
    });

    wrap.appendChild(table);
    container.appendChild(wrap);
    return;
  }

  // MODOS CARDS E LISTA: card inteiro clicável
  container.className = activeView === "list" ? "view-list" : "view-cards";

  filtered.forEach(entry => {
    const d = entry.dramas || {};
    const card = document.createElement("article");
    card.className = "drama-card";
    card.title = `Abrir detalhes de ${d.title || "drama"}`;
    card.addEventListener("click", () => goToDrama(entry.drama_id));
    attachKeyboardOpen(card, entry.drama_id);

    const poster = document.createElement("img");
    poster.className = "drama-poster";
    poster.src = d.poster_url || "";
    poster.alt = d.title || "Drama";
    poster.loading = "lazy";
    poster.onerror = () => { poster.style.display = "none"; };

    const overlay = document.createElement("div");
    overlay.className = "drama-overlay";

    const h3 = document.createElement("h3");
    h3.className = "drama-title";
    h3.textContent = d.title || "Sem título";

    const meta = document.createElement("div");
    meta.className = "drama-meta";
    meta.textContent = [d.year, d.genre].filter(Boolean).join(" · ") || "GL";

    overlay.append(h3, meta);

    if (activeView === "cards") {
      overlay.appendChild(buildRowControls(entry));
      card.append(poster, overlay);
    } else {
      const left = document.createElement("div");
      left.className = "drama-left";
      left.append(poster, overlay);
      card.append(left, buildRowControls(entry));
    }

    container.appendChild(card);
  });
}

async function loadMyList() {
  const { data: sessionData } = await db.auth.getSession();
  currentUser = sessionData?.session?.user || null;

  if (!currentUser) {
    document.getElementById("not-logged").hidden = false;
    document.getElementById("list-content").hidden = true;
    return;
  }

  document.getElementById("not-logged").hidden = true;
  document.getElementById("list-content").hidden = false;

  document.querySelectorAll("#status-tabs .status-tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.status === activeStatus);
  });

  const { data, error } = await db
    .from("user_drama_list")
    .select("id, drama_id, status, updated_at, dramas(id, title, year, genre, poster_url)")
    .eq("user_id", currentUser.id)
    .order("updated_at", { ascending: false });

  if (error) {
    console.error("Erro ao carregar lista:", error);
    container.innerHTML = "<p>Não foi possível carregar sua lista.</p>";
    return;
  }

  myEntries = data || [];
  renderMyList();
}

document.querySelectorAll("#status-tabs .status-tab").forEach(btn => {
  btn.addEventListener("click", () => {
    activeStatus = btn.dataset.status;
    document.querySelectorAll("#status-tabs .status-tab").forEach(b => b.classList.toggle("active", b === btn));
    renderMyList();
  });
});

document.querySelectorAll("#view-switcher .view-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    activeView = btn.dataset.view;
    document.querySelectorAll("#view-switcher .view-btn").forEach(b => b.classList.toggle("active", b === btn));
    renderMyList();
  });
});

loadMyList();
</script>

</body>
</html>
