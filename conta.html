
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha conta | ThaiGList</title>

<style>
* { box-sizing: border-box; }

:root {
  --background: #100d18;
  --surface: #1b1626;
  --pink: #f05ba8;
  --purple: #a875f5;
  --text: #f7efff;
  --muted: #b8a9c9;
  --border: #382b49;
}

body {
  margin: 0;
  padding: 25px 15px;
  background: var(--background);
  color: var(--text);
  font-family: Arial, sans-serif;
}

.container {
  max-width: 480px;
  margin: 40px auto;
}

header {
  text-align: center;
  margin-bottom: 25px;
}

header h1 { color: white; }
header p { color: var(--muted); }

main {
  padding: 25px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
}

h2 { color: var(--pink); }

label {
  display: block;
  margin: 15px 0 7px;
  color: var(--muted);
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #241d32;
  color: white;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(100deg, var(--pink), var(--purple));
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

.divider {
  margin: 28px 0;
  border-top: 1px solid var(--border);
}

#message {
  margin-top: 18px;
  color: var(--pink);
  line-height: 1.5;
}

a {
  display: block;
  margin-top: 22px;
  color: var(--pink);
  text-align: center;
  text-decoration: none;
}

#account-panel {
  text-align: center;
}

.avatar-container {
  width: 125px;
  height: 125px;
  margin: 20px auto;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid var(--pink);
  background: linear-gradient(135deg, var(--pink), var(--purple));
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 20px #f05ba844;
}

#account-avatar {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

#avatar-fallback {
  font-size: 48px;
}

#account-name {
  color: white;
  font-size: 23px;
  margin: 12px 0;
}

#account-email {
  color: var(--muted);
  font-size: 14px;
  word-break: break-word;
}

.account-description {
  color: var(--muted);
  line-height: 1.6;
  margin: 20px 0;
}

.photo-description {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  margin-top: 10px;
}

#photo-input {
  display: none;
}

.photo-button {
  background: #30213e;
  border: 1px solid #71428c;
}

#save-photo-button {
  margin-top: 12px;
}

.secondary-button {
  background: #30213e;
  border: 1px solid #71428c;
}

#logout-button {
  background: #493044;
}

[hidden] {
  display: none !important;
}

/* POPUP */

.popup-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #000000bb;
  z-index: 9999;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.popup-overlay.active {
  display: flex;
}

.popup-box {
  width: 100%;
  max-width: 380px;
  padding: 30px 25px;
  text-align: center;
  background: #1b1626;
  border: 1px solid #71428c;
  border-radius: 18px;
  box-shadow: 0 10px 40px #00000088;
}

.popup-icon {
  font-size: 42px;
  margin-bottom: 12px;
}

.popup-box h3 {
  color: var(--pink);
}

.popup-box p {
  color: #d0c3dc;
  line-height: 1.6;
}

</style>
</head>

<body>

<div class="container">

<header>
  <h1>ThaiGList 🌷</h1>
  <p>Seu espaço pessoal no universo Girls' Love.</p>
</header>

<main>

<!-- FORMULÁRIOS DE AUTENTICAÇÃO -->

<div id="auth-forms" hidden>

  <section>
    <h2>Criar minha conta</h2>

    <form id="signup-form">

      <label for="signup-email">E-mail</label>
      <input id="signup-email" type="email" required>

      <label for="signup-password">Senha</label>
      <input id="signup-password"
        type="password" minlength="6" required>

      <button id="signup-button" type="submit">
        Criar conta
      </button>

    </form>
  </section>

  <div class="divider"></div>

  <section>
    <h2>Já tenho uma conta</h2>

    <form id="login-form">

      <label for="login-email">E-mail</label>
      <input id="login-email" type="email" required>

      <label for="login-password">Senha</label>
      <input id="login-password" type="password" required>

      <button id="login-button" type="submit">
        Entrar
      </button>

    </form>
  </section>

</div>


<!-- ÁREA DA CONTA -->

<section id="account-panel" hidden>

  <h2>Minha conta 🌷</h2>

  <div class="avatar-container">

    <img id="account-avatar" src="" alt="Minha foto de perfil">

    <span id="avatar-fallback">👤</span>

  </div>

  <p class="photo-description">
    Escolha uma foto para personalizar seu perfil.
  </p>

  <input
    id="photo-input"
    type="file"
    accept="image/jpeg,image/png,image/webp"
  >

  <button
    type="button"
    id="change-photo-button"
    class="photo-button"
  >
    📷 Alterar foto
  </button>

  <button
    type="button"
    id="save-photo-button"
    hidden
  >
    Salvar foto
  </button>

  <h3 id="account-name">Carregando...</h3>

  <p id="account-email"></p>

  <p class="account-description">
    Bem-vinda ao seu espaço pessoal no ThaiGList!
    Aqui ficará seu perfil e suas informações.
  </p>

  <button
    type="button"
    class="secondary-button"
    id="back-catalog"
  >
    ← Voltar ao catálogo
  </button>

  <button
    type="button"
    id="logout-button"
  >
    Sair da conta
  </button>

</section>


<!-- POPUP -->

<div id="popup" class="popup-overlay">

  <div class="popup-box">

    <div id="popup-icon" class="popup-icon">🌷</div>

    <h3 id="popup-title">Aviso</h3>

    <p id="popup-text"></p>

    <button id="popup-close" type="button">
      Entendi
    </button>

  </div>

</div>

<p id="message" role="status" aria-live="polite"></p>

<a href="index.html">← Voltar ao catálogo</a>

</main>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// ========================================
// CONEXÃO SUPABASE
// ========================================

const SUPABASE_URL =
  "https://jjybnidhwfimcdwygafk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_DyikY0WSJJ4apDc0_ZwfOw_x6LvfqM-";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const authForms = document.getElementById("auth-forms");
const accountPanel = document.getElementById("account-panel");

let activeUserId = null;
let selectedPhoto = null;
let currentAvatarPath = null;


// ========================================
// ELEMENTOS DA FOTO
// ========================================

const avatar = document.getElementById("account-avatar");
const fallback = document.getElementById("avatar-fallback");

const photoInput = document.getElementById("photo-input");

const changePhotoButton =
  document.getElementById("change-photo-button");

const savePhotoButton =
  document.getElementById("save-photo-button");


// ========================================
// POPUP
// ========================================

function showPopup(title, text, icon = "🌷") {

  document.getElementById("popup-title").textContent = title;
  document.getElementById("popup-text").textContent = text;
  document.getElementById("popup-icon").textContent = icon;

  document.getElementById("popup").classList.add("active");

}

document.getElementById("popup-close")
.addEventListener("click", function() {

  document.getElementById("popup").classList.remove("active");

});


// ========================================
// EXIBIR FOTO
// ========================================

function displayAvatar(url) {

  if (!url) {

    avatar.style.display = "none";
    avatar.removeAttribute("src");

    fallback.style.display = "block";

    return;

  }

  avatar.onload = () => {

    avatar.style.display = "block";
    fallback.style.display = "none";

  };

  avatar.onerror = () => {

    avatar.style.display = "none";
    fallback.style.display = "block";

  };

  avatar.src = url;

}


// ========================================
// MOSTRAR USUÁRIO CONECTADO
// ========================================

async function showAccount(user) {

  if (!user) return;

  activeUserId = user.id;

  selectedPhoto = null;
  currentAvatarPath = null;

  photoInput.value = "";
  savePhotoButton.hidden = true;

  authForms.hidden = true;
  accountPanel.hidden = false;

  displayAvatar(null);

  const email = user.email || "";

  const fallbackName =
    user.user_metadata?.full_name ||
    user.user_metadata?.name ||
    email.split("@")[0] ||
    "Usuário";

  document.getElementById("account-name").textContent =
    fallbackName;

  document.getElementById("account-email").textContent =
    email;

  const { data, error } = await client
    .from("profiles")
    .select("display_name, avatar_url")
    .eq("id", user.id)
    .maybeSingle();

  if (activeUserId !== user.id) return;

  if (error) {

    console.error("Erro ao carregar perfil:", error);

    showPopup(
      "Aviso",
      "Não foi possível carregar todas as informações do perfil.",
      "⚠️"
    );

    return;

  }

  if (!data) return;

  if (data.display_name) {

    document.getElementById("account-name").textContent =
      data.display_name;

  }

  if (data.avatar_url) {

    displayAvatar(data.avatar_url);

    // Recupera o caminho do arquivo para eventual substituição.

    const marker = "/storage/v1/object/public/avatars/";

    const index = data.avatar_url.indexOf(marker);

    if (index !== -1) {

      currentAvatarPath =
        decodeURIComponent(
          data.avatar_url.substring(index + marker.length).split("?")[0]
        );

    }

  }

}


// ========================================
// MOSTRAR FORMULÁRIOS
// ========================================

function showLogin() {

  activeUserId = null;
  selectedPhoto = null;
  currentAvatarPath = null;

  accountPanel.hidden = true;
  authForms.hidden = false;

  photoInput.value = "";
  savePhotoButton.hidden = true;

}


// ========================================
// SELECIONAR FOTO
// ========================================

changePhotoButton.addEventListener("click", function() {

  photoInput.click();

});


photoInput.addEventListener("change", function(event) {

  const file = event.target.files[0];

  if (!file) return;

  const allowedTypes = [
    "image/jpeg",
    "image/png",
    "image/webp"
  ];

  if (!allowedTypes.includes(file.type)) {

    showPopup(
      "Formato inválido",
      "Escolha uma imagem JPG, PNG ou WebP.",
      "⚠️"
    );

    photoInput.value = "";

    return;

  }

  if (file.size > 5 * 1024 * 1024) {

    showPopup(
      "Imagem muito grande",
      "A foto precisa ter no máximo 5 MB.",
      "⚠️"
    );

    photoInput.value = "";

    return;

  }

  selectedPhoto = file;

  const previewURL = URL.createObjectURL(file);

  displayAvatar(previewURL);

  savePhotoButton.hidden = false;

});


// ========================================
// SALVAR FOTO NO SUPABASE
// ========================================

savePhotoButton.addEventListener("click", async function() {

  if (!selectedPhoto || !activeUserId) {

    showPopup(
      "Atenção",
      "Selecione uma foto antes de salvar.",
      "⚠️"
    );

    return;

  }

  const button = this;

  const userId = activeUserId;

  button.disabled = true;
  button.textContent = "Salvando foto...";

  try {

    const extension = selectedPhoto.name
      .split(".")
      .pop()
      .toLowerCase();

    const filePath =
      userId + "/avatar-" + Date.now() + "." + extension;

    // Envia a nova foto para o Storage.

    const { data: uploadData, error: uploadError } =
      await client.storage
        .from("avatars")
        .upload(filePath, selectedPhoto, {
          cacheControl: "3600",
          upsert: false,
          contentType: selectedPhoto.type
        });

    if (uploadError) throw uploadError;

    // Obtém o endereço público.

    const { data: publicData } =
      client.storage
        .from("avatars")
        .getPublicUrl(filePath);

    const publicURL = publicData.publicUrl;

    // Atualiza o perfil.

    const { error: updateError } = await client
      .from("profiles")
      .update({
        avatar_url: publicURL
      })
      .eq("id", userId);

    if (updateError) {

      // Evita deixar o arquivo novo abandonado.

      await client.storage
        .from("avatars")
        .remove([filePath]);

      throw updateError;

    }

    // Guarda o caminho da nova foto.

    const previousPath = currentAvatarPath;

    currentAvatarPath = filePath;

    // Atualiza a imagem na página.

    displayAvatar(publicURL);

    selectedPhoto = null;
    photoInput.value = "";

    savePhotoButton.hidden = true;

    showPopup(
      "Foto atualizada!",
      "Sua nova foto de perfil foi salva com sucesso. 🌷",
      "🎉"
    );

    // Remove a foto antiga somente após atualizar o perfil.

    if (previousPath) {

      const { error: removeError } = await client.storage
        .from("avatars")
        .remove([previousPath]);

      if (removeError) {

        console.warn(
          "Não foi possível remover a foto anterior:",
          removeError
        );

      }

    }

  } catch (error) {

    console.error("Erro ao salvar foto:", error);

    showPopup(
      "Não foi possível salvar",
      error.message || "Ocorreu um erro durante o envio da foto.",
      "⚠️"
    );

  } finally {

    button.disabled = false;
    button.textContent = "Salvar foto";

  }

});


// ========================================
// VERIFICAR SESSÃO
// ========================================

async function checkSession() {

  const { data, error } = await client.auth.getSession();

  if (error) {

    console.error(error);

    showLogin();

    return;

  }

  if (data.session) {

    await showAccount(data.session.user);

  } else {

    showLogin();

  }

}


// ========================================
// ACOMPANHAR AUTENTICAÇÃO
// ========================================

client.auth.onAuthStateChange((event, session) => {

  if (event === "SIGNED_OUT") {

    showLogin();

  } else if (session) {

    showAccount(session.user);

  } else {

    showLogin();

  }

});


// ========================================
// CRIAR CONTA
// ========================================

document.getElementById("signup-form")
.addEventListener("submit", async function(event) {

  event.preventDefault();

  const button = document.getElementById("signup-button");

  const email =
    document.getElementById("signup-email").value.trim();

  const password =
    document.getElementById("signup-password").value;

  button.disabled = true;
  button.textContent = "Criando conta...";

  const { data, error } = await client.auth.signUp({

    email,
    password,

    options: {

      emailRedirectTo:
        "https://danielegbittencourt-cloud.github.io/thaiglist/"

    }

  });

  button.disabled = false;
  button.textContent = "Criar conta";

  if (error) {

    showPopup(
      "Ops!",
      "Não foi possível criar a conta: " + error.message,
      "⚠️"
    );

    return;

  }

  if (data.session) {

    await showAccount(data.session.user);

    showPopup(
      "Conta criada!",
      "Sua conta foi criada e você já está conectada. 🌷",
      "🎉"
    );

  } else {

    showPopup(
      "Cadastro realizado!",
      "Confira seu e-mail para confirmar sua conta no ThaiGList.",
      "💌"
    );

  }

});


// ========================================
// LOGIN
// ========================================

document.getElementById("login-form")
.addEventListener("submit", async function(event) {

  event.preventDefault();

  const button = document.getElementById("login-button");

  const email =
    document.getElementById("login-email").value.trim();

  const password =
    document.getElementById("login-password").value;

  button.disabled = true;
  button.textContent = "Entrando...";

  const { error } = await client.auth.signInWithPassword({

    email,
    password

  });

  button.disabled = false;
  button.textContent = "Entrar";

  if (error) {

    showPopup(
      "Ops!",
      "E-mail ou senha incorretos.",
      "⚠️"
    );

    return;

  }

  window.location.href = "index.html";

});


// ========================================
// VOLTAR AO CATÁLOGO
// ========================================

document.getElementById("back-catalog")
.addEventListener("click", function() {

  window.location.href = "index.html";

});


// ========================================
// SAIR DA CONTA
// ========================================

document.getElementById("logout-button")
.addEventListener("click", async function() {

  const button = this;

  button.disabled = true;
  button.textContent = "Saindo...";

  const { error } = await client.auth.signOut();

  button.disabled = false;
  button.textContent = "Sair da conta";

  if (error) {

    showPopup(
      "Ops!",
      "Não foi possível sair da conta.",
      "⚠️"
    );

    console.error(error);

    return;

  }

  window.location.href = "index.html";

});


// ========================================
// INICIALIZAÇÃO
// ========================================

checkSession();

</script>

</body>
</html>
