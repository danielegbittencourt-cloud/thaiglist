
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThaiGList 🌷</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 30px 20px;
  background: #fff5f8;
  color: #493744;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 1100px;
  margin: auto;
}

header {
  text-align: center;
  padding: 45px 20px;
  background: linear-gradient(135deg, #f8c8dc, #e6d5f5);
  border-radius: 20px;
  margin-bottom: 30px;
}

header h1 {
  font-size: 42px;
  color: #8e4774;
  margin: 0 0 12px;
}

header p { color: #654c60; }

main {
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 5px 20px #d9b8cc55;
}

h2 { color: #a45482; }

#search {
  width: 100%;
  padding: 14px;
  border: 2px solid #ecc8dc;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
}

#search:focus { border-color: #bd79a8; }

#series-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-top: 25px;
}

.series-card {
  overflow: hidden;
  background: #fff7fb;
  border: 1px solid #f0d2e3;
  border-radius: 16px;
  transition: .2s;
  cursor: pointer;
}

.series-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 6px 16px #d9b8cc55;
}

.poster {
  width: 100%;
  height: 290px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg, #f8c8dc, #e6d5f5);
  color: #8e4774;
  text-align: center;
  font-weight: bold;
  padding: 15px;
}

.poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-content { padding: 17px; }

.series-card h3 {
  color: #a45482;
  font-size: 19px;
  margin: 0 0 7px;
}

.original-title {
  color: #987d91;
  font-size: 13px;
  margin: 0 0 12px;
}

.series-card p {
  color: #70566a;
  font-size: 14px;
  line-height: 1.5;
  margin: 7px 0;
}

.synopsis {
  border-top: 1px solid #f0d2e3;
  padding-top: 10px;
  margin-top: 12px !important;
}

.status {
  display: inline-block;
  padding: 7px 11px;
  margin-top: 8px;
  border-radius: 20px;
  background: #f1dfed;
  color: #854d78;
  font-size: 12px;
  font-weight: bold;
}

#add-button {
  display: block;
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #b76b9b;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

#add-button:disabled {
  opacity: .65;
  cursor: not-allowed;
}

#series-form {
  margin-top: 20px;
  padding: 24px;
  background: #fff7fb;
  border: 1px solid #ecc8dc;
  border-radius: 16px;
}

#series-form[hidden] { display: none; }

#series-form h3 { color: #a45482; }

#series-form label {
  display: block;
  margin: 14px 0 6px;
  color: #70566a;
  font-weight: bold;
}

#series-form input,
#series-form select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ecc8dc;
  border-radius: 10px;
  background: white;
  font-size: 15px;
}

.form-buttons {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.form-buttons button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #b76b9b;
  color: white;
}

#cancel-button { background: #a99aaa; }

footer {
  text-align: center;
  padding: 25px;
  color: #987d91;
}

@media (max-width: 520px) {
  body { padding: 16px 12px; }
  main { padding: 19px; }
  .poster { height: 260px; }
}
  .weekly-carousel {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  overflow: hidden;
}

#weekly-list {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  scroll-behavior: smooth;
  flex: 1;
  padding: 10px 5px;
}

.weekly-card {
  flex: 0 0 140px;
  width: 140px;
  text-decoration: none;
}

.weekly-card img {
  width: 140px;
  height: 200px;
  object-fit: cover;
  border-radius: 10px;
  display: block;
}

.weekly-card h3 {
  font-size: 14px;
  text-align: center;
  margin-top: 8px;
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>ThaiGList 🌷</h1>
  <p>Seu cantinho para acompanhar o universo Girls' Love tailandês.</p>
</header>

<main>
  <h2>Minha coleção</h2>

  <input
    type="text"
    id="search"
    placeholder="Pesquisar por título ou gênero..."
    aria-label="Pesquisar dramas"
  >

  <button type="button" id="add-button" disabled>
    Cadastro em breve 🌷
  </button>

  <form id="series-form" hidden>
    <h3>Nova série</h3>

    <label>Nome da série</label>
    <input type="text" id="title" required>

    <label>Ano de lançamento</label>
    <input type="number" id="year">

    <label>País</label>
    <input type="text" id="country">

    <label>Número de episódios</label>
    <input type="number" id="episodes">

    <label>Status</label>
    <select id="status">
      <option value="Quero assistir">Quero assistir</option>
      <option value="Assistindo">Assistindo</option>
      <option value="Concluída">Concluída</option>
    </select>

    <div class="form-buttons">
      <button type="submit">Salvar série</button>
      <button type="button" id="cancel-button">Cancelar</button>
    </div>
  </form>

  <section class="weekly-section">
  <h2>🌷 GLs da Semana</h2>
  <p class="weekly-subtitle">
    Seus dramas em destaque nesta semana
  </p>

  <div class="weekly-carousel">
    <button id="weekly-prev" type="button">❮</button>

    <div id="weekly-list">
      <p>Carregando destaques... 🌷</p>
    </div>

    <button id="weekly-next" type="button">❯</button>
  </div>
</section>

<div id="series-list">
  <p>Carregando catálogo... 🌷</p>
</div>
 </main>

<footer>
  <p>ThaiGList © 2026</p>
</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://jjybnidhwfimcdwygafk.supabase.co";
const SUPABASE_KEY = "sb_publishable_DyikY0WSJJ4apDc0_ZwfOw_x6LvfqM-";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let series = [];

const list = document.getElementById("series-list");
const search = document.getElementById("search");

function createText(tag, className, value) {
  const element = document.createElement(tag);
  element.className = className;
  element.textContent = value;
  return element;
}

function showSeries(items) {
  list.innerHTML = "";

  if (!items.length) {
    list.appendChild(
      createText("p", "", "Nenhuma série encontrada 🌷")
    );
    return;
  }

  items.forEach(item => {
    const card = document.createElement("article");
    card.className = "series-card";
card.addEventListener("click", () => {
  window.location.href = "drama.html?id=" + encodeURIComponent(item.id);
});
    const poster = document.createElement("div");
    poster.className = "poster";

    if (item.poster_url) {
      const image = document.createElement("img");
      image.src = item.poster_url;
      image.alt = "Pôster de " + (item.title || "drama");
      image.loading = "lazy";

      image.onerror = () => {
        poster.textContent = "Capa em breve 🌷";
      };

      poster.appendChild(image);
    } else {
      poster.textContent = "Capa em breve 🌷";
    }

    const content = document.createElement("div");
    content.className = "card-content";

    content.appendChild(
      createText("h3", "", item.title || "Sem título")
    );

    if (item.original_title) {
      content.appendChild(
        createText("p", "original-title", item.original_title)
      );
    }

    if (item.year) {
      content.appendChild(
        createText("p", "", "Ano: " + item.year)
      );
    }

    if (item.country) {
      content.appendChild(
        createText("p", "", "País: " + item.country)
      );
    }

    if (item.episodes) {
      content.appendChild(
        createText("p", "", "Episódios: " + item.episodes)
      );
    }

    if (item.genre) {
      content.appendChild(
        createText("p", "", "Gênero: " + item.genre)
      );
    }

    if (item.status) {
      content.appendChild(
        createText("span", "status", item.status)
      );
    }

    if (item.synopsis) {
      content.appendChild(
        createText("p", "synopsis", item.synopsis)
      );
    }

    card.append(poster, content);
    list.appendChild(card);
  });
}

async function loadSeries() {
  list.innerHTML = "<p>Carregando catálogo... 🌷</p>";

  const { data, error } = await db
    .from("dramas")
    .select(`
      id,
      title,
      original_title,
      synopsis,
      year,
      episodes,
      poster_url,
      genre,
      status,
      country,
      weekly_featured
    `)
    .order("id");

  if (error) {
    console.error("Erro ao carregar dramas:", error);
    list.innerHTML =
      "<p>Não foi possível carregar o catálogo.</p>";
    return;
  }

  series = data || [];

  // Carrega o catálogo normal
  showSeries(series);

  // Seleciona somente os GLs da semana
  const weeklySeries = series.filter(
    item => item.weekly_featured === true
  );

  showWeeklySeries(weeklySeries);
}

function showWeeklySeries(items) {
  const weeklyList = document.getElementById("weekly-list");

  weeklyList.innerHTML = "";

  if (!items.length) {
    weeklyList.textContent =
      "Em breve teremos GLs em destaque! 🌷";
    return;
  }

  items.forEach(item => {
    const card = document.createElement("article");
    card.className = "weekly-card";

    card.addEventListener("click", () => {
      window.location.href =
        "drama.html?id=" + encodeURIComponent(item.id);
    });

    if (item.poster_url) {
      const image = document.createElement("img");
      image.src = item.poster_url;
      image.alt = "Pôster de " + item.title;
      image.loading = "lazy";
      card.appendChild(image);
    } else {
      const placeholder = document.createElement("div");
      placeholder.textContent = "Capa em breve 🌷";
      card.appendChild(placeholder);
    }

    const title = document.createElement("h3");
    title.textContent = item.title || "Sem título";

    card.appendChild(title);
    weeklyList.appendChild(card);
  });
}

// Navegação do carrossel
document.getElementById("weekly-prev").addEventListener("click", () => {
  document.getElementById("weekly-list").scrollBy({
    left: -220,
    behavior: "smooth"
  });
});

document.getElementById("weekly-next").addEventListener("click", () => {
  document.getElementById("weekly-list").scrollBy({
    left: 220,
    behavior: "smooth"
  });
});
// Pesquisa do catálogo
search.addEventListener("input", () => {
  const term = search.value.trim().toLowerCase();

  const filtered = series.filter(item => {
    const searchable = [
      item.title,
      item.original_title,
      item.genre
    ].join(" ").toLowerCase();

    return searchable.includes(term);
  });

  showSeries(filtered);
});

// Inicia o carregamento
loadSeries();
</script>

</body>
</html>
