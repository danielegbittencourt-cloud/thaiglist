
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalhes do drama | ThaiGList</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 15px;
  background: #fff5f8;
  color: #493744;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 850px;
  margin: auto;
}

header {
  text-align: center;
  padding: 30px 15px;
  background: linear-gradient(135deg, #f8c8dc, #e6d5f5);
  border-radius: 20px;
}

header h1 {
  color: #8e4774;
  margin: 0;
}

main {
  margin-top: 25px;
  padding: 25px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 5px 20px #d9b8cc55;
}

.back {
  display: inline-block;
  margin-bottom: 20px;
  color: #a45482;
  font-weight: bold;
  text-decoration: none;
}

.details {
  display: flex;
  gap: 25px;
  flex-wrap: wrap;
}

.poster {
  width: 260px;
  max-width: 100%;
  border-radius: 14px;
  object-fit: cover;
  align-self: flex-start;
}

.information {
  flex: 1;
  min-width: 220px;
}

h2 { color: #a45482; }

.original-title {
  color: #987d91;
}

p {
  color: #70566a;
  line-height: 1.6;
}

.status {
  display: inline-block;
  padding: 8px 13px;
  border-radius: 20px;
  background: #f1dfed;
  color: #854d78;
  font-size: 13px;
  font-weight: bold;
}

.synopsis {
  margin-top: 25px;
  padding-top: 15px;
  border-top: 1px solid #f0d2e3;
}

footer {
  text-align: center;
  padding: 20px;
  color: #987d91;
}

@media (max-width: 600px) {
  .details { flex-direction: column; }
  .poster { width: 100%; max-width: 300px; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>ThaiGList 🌷</h1>
  <p>Detalhes da série</p>
</header>

<main>
  <a class="back" href="index.html">← Voltar ao catálogo</a>

  <div id="details">
    <p>Carregando informações... 🌷</p>
  </div>
</main>

<footer>ThaiGList © 2026</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://jjybnidhwfimcdwygafk.supabase.co";
const SUPABASE_KEY = "sb_publishable_DyikY0WSJJ4apDc0_ZwfOw_x6LvfqM-";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const details = document.getElementById("details");

function addText(parent, tag, className, value) {
  const element = document.createElement(tag);
  element.className = className;
  element.textContent = value;
  parent.appendChild(element);
  return element;
}

async function loadDrama() {
  const id = new URLSearchParams(window.location.search).get("id");

  if (!id) {
    details.textContent = "Série não encontrada.";
    return;
  }

  const { data, error } = await db
    .from("dramas")
    .select("*")
    .eq("id", id)
    .single();

  if (error || !data) {
    details.textContent = "Não foi possível carregar esta série.";
    console.error(error);
    return;
  }

  details.innerHTML = "";

  const layout = document.createElement("div");
  layout.className = "details";

  if (data.poster_url) {
    const image = document.createElement("img");
    image.className = "poster";
    image.src = data.poster_url;
    image.alt = "Pôster de " + (data.title || "drama");
    image.onerror = () => {
      image.remove();
    };
    layout.appendChild(image);
  }

  const info = document.createElement("div");
  info.className = "information";

  addText(info, "h2", "", data.title || "Sem título");

  if (data.original_title) {
    addText(info, "p", "original-title", data.original_title);
  }

  if (data.year) addText(info, "p", "", "Ano: " + data.year);
  if (data.country) addText(info, "p", "", "País: " + data.country);
  if (data.episodes) addText(info, "p", "", "Episódios: " + data.episodes);
  if (data.genre) addText(info, "p", "", "Gênero: " + data.genre);

  if (data.status) {
    addText(info, "span", "status", data.status);
  }

  layout.appendChild(info);
  details.appendChild(layout);

  if (data.synopsis) {
    const synopsis = document.createElement("section");
    synopsis.className = "synopsis";
    addText(synopsis, "h2", "", "Sinopse");
    addText(synopsis, "p", "", data.synopsis);
    details.appendChild(synopsis);
  }
}

loadDrama();
</script>

</body>
</html>
