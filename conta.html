
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha conta | ThaiGList</title>

<style>
* { box-sizing: border-box; }

:root {
  --background: #100d18;
  --surface: #1b1626;
  --pink: #f05ba8;
  --purple: #a875f5;
  --text: #f7efff;
  --muted: #b8a9c9;
  --border: #382b49;
}

body {
  margin: 0;
  padding: 25px 15px;
  background: var(--background);
  color: var(--text);
  font-family: Arial, sans-serif;
}

.container {
  max-width: 480px;
  margin: 40px auto;
}

header {
  text-align: center;
  margin-bottom: 25px;
}

header h1 {
  color: white;
}

header p {
  color: var(--muted);
}

main {
  padding: 25px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
}

h2 {
  color: var(--pink);
}

label {
  display: block;
  margin: 15px 0 7px;
  color: var(--muted);
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #241d32;
  color: white;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(100deg, var(--pink), var(--purple));
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

.divider {
  margin: 28px 0;
  border-top: 1px solid var(--border);
}

#message {
  margin-top: 18px;
  color: var(--pink);
  line-height: 1.5;
}

a {
  display: block;
  margin-top: 22px;
  color: var(--pink);
  text-align: center;
  text-decoration: none;
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>ThaiGList 🌷</h1>
  <p>Seu espaço pessoal no universo Girls' Love.</p>
</header>

<main>

  <section>
    <h2>Criar minha conta</h2>

    <form id="signup-form">
      <label for="signup-email">E-mail</label>
      <input id="signup-email" type="email" required>

      <label for="signup-password">Senha</label>
      <input id="signup-password" type="password"
        minlength="6" required>

      <button id="signup-button" type="submit">
        Criar conta
      </button>
    </form>
  </section>

  <div class="divider"></div>

  <section>
    <h2>Já tenho uma conta</h2>

    <form id="login-form">
      <label for="login-email">E-mail</label>
      <input id="login-email" type="email" required>

      <label for="login-password">Senha</label>
      <input id="login-password" type="password" required>

      <button id="login-button" type="submit">
        Entrar
      </button>
    </form>
  </section>

  <p id="message" role="status" aria-live="polite"></p>

  <a href="index.html">← Voltar ao catálogo</a>

</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://jjybnidhwfimcdwygafk.supabase.co";

const SUPABASE_KEY = "sb_publishable_DyikY0WSJJ4apDc0_ZwfOw_x6LvfqM-";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const message = document.getElementById("message");

document.getElementById("signup-form")
.addEventListener("submit", async function(event) {
  event.preventDefault();

  const button = document.getElementById("signup-button");
  const email = document.getElementById("signup-email").value;
  const password = document.getElementById("signup-password").value;

  button.disabled = true;
  button.textContent = "Criando conta...";
  message.textContent = "";

  const { data, error } = await client.auth.signUp({
    email: email,
    password: password,
    options: {
      emailRedirectTo: "https://danielegbittencourt-cloud.github.io/thaiglist/"
    }
  });

  button.disabled = false;
  button.textContent = "Criar conta";

  if (error) {
    message.textContent = "Não foi possível criar a conta: " + error.message;
    return;
  }

  if (data.session) {
    message.textContent = "Conta criada! Você já está conectado.";
  } else {
    message.textContent = "Conta criada! Confira seu e-mail para confirmar o cadastro.";
  }
});

document.getElementById("login-form")
.addEventListener("submit", async function(event) {
  event.preventDefault();

  const button = document.getElementById("login-button");
  const email = document.getElementById("login-email").value;
  const password = document.getElementById("login-password").value;

  button.disabled = true;
  button.textContent = "Entrando...";
  message.textContent = "";

  const { error } = await client.auth.signInWithPassword({
    email: email,
    password: password
  });

  button.disabled = false;
  button.textContent = "Entrar";

  if (error) {
    message.textContent = "Não foi possível entrar: " + error.message;
    return;
  }

  message.textContent = "Login realizado com sucesso! Sua conta está conectada.";
});
</script>

</body>
</html>
