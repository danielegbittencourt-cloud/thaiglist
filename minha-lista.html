<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Lista | ThaiGList 🌷</title>

<style>
*,
*::before,
*::after {
  box-sizing: border-box;
}

:root {
  --background: #100d18;
  --surface: #1b1626;
  --surface-light: #241d32;
  --surface-hover: #2c233d;
  --pink: #f05ba8;
  --purple: #a875f5;
  --text: #f7efff;
  --muted: #b8a9c9;
  --border: #382b49;
}

body {
  margin: 0;
  padding: 20px 15px;
  background: var(--background);
  color: var(--text);
  font-family: Arial, sans-serif;
}

.container {
  max-width: 1120px;
  margin: auto;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
  padding: 18px 22px;
  background: linear-gradient(120deg, #1d1329, #2b1938);
  border: 1px solid #49335c;
  border-radius: 16px;
  box-shadow: 0 6px 20px #00000038;
}

header h1 {
  margin: 0;
  font-size: 24px;
  color: #ffffff;
}

.header-nav {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.nav-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: bold;
  text-decoration: none;
  color: var(--text);
  background: rgba(36, 29, 50, 0.9);
  border: 1px solid #493956;
  transition: transform 0.15s, border-color 0.15s, background 0.15s;
}

.nav-pill:hover {
  border-color: var(--purple);
  transform: translateY(-1px);
}

.nav-pill-primary {
  color: #ffffff;
  background: linear-gradient(120deg, rgba(240, 91, 168, 0.28), rgba(168, 117, 245, 0.28));
  border: 1px solid rgba(240, 91, 168, 0.55);
}

.nav-pill-primary:hover {
  background: linear-gradient(120deg, var(--pink), var(--purple));
  border-color: transparent;
}

main {
  margin-top: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 26px;
  box-shadow: 0 8px 30px #00000033;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.status-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.status-tab {
  padding: 9px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface-light);
  color: var(--muted);
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.18s;
}

.status-tab:hover {
  color: #ffffff;
  border-color: var(--purple);
}

.status-tab.active {
  background: linear-gradient(100deg, var(--pink), var(--purple));
  border-color: transparent;
  color: #ffffff;
}

.view-switcher {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.view-btn {
  padding: 8px 13px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-light);
  color: var(--muted);
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

.view-btn.active {
  background: linear-gradient(100deg, var(--pink), var(--purple));
  border-color: transparent;
  color: #ffffff;
}

/* MODO CARDS */
#list-container.view-cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 20px;
}

#list-container.view-cards .drama-card {
  position: relative;
  aspect-ratio: 2 / 3;
  border-radius: 16px;
  overflow: hidden;
  background: var(--surface-light);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

#list-container.view-cards .drama-card:hover {
  transform: translateY(-4px);
  border-color: var(--pink);
  box-shadow: 0 8px 24px rgba(240, 91, 168, 0.18);
}

#list-container.view-cards .drama-poster {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

#list-container.view-cards .drama-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 14px;
  background: linear-gradient(
    to bottom,
    transparent 35%,
    rgba(16, 13, 24, 0.85) 70%,
    rgba(16, 13, 24, 0.98) 100%
  );
}

#list-container.view-cards .drama-title {
  margin: 0 0 4px;
  font-size: 14.5px;
  color: #ffffff;
}

#list-container.view-cards .drama-meta {
  font-size: 11.5px;
  color: var(--muted);
  margin-bottom: 10px;
}

/* MODO LISTA */
#list-container.view-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

#list-container.view-list .drama-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 16px;
  border-radius: 14px;
  background: var(--surface-light);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
}

#list-container.view-list .drama-card:hover {
  border-color: var(--pink);
  background: var(--surface-hover);
  transform: translateX(2px);
}

#list-container.view-list .drama-left {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: 1;
  min-width: 0;
}

#list-container.view-list .drama-poster {
  width: 52px;
  height: 76px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
}

#list-container.view-list .drama-overlay {
  min-width: 0;
  flex: 1;
}

#list-container.view-list .drama-title {
  margin: 0 0 4px;
  font-size: 15.5px;
  color: #ffffff;
}

#list-container.view-list .drama-meta {
  font-size: 12.5px;
  color: var(--muted);
}

.card-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.status-select {
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid #493956;
  background: #171222;
  color: #ffffff;
  font-size: 12px;
  cursor: pointer;
}

.remove-btn {
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid rgba(255, 92, 138, 0.45);
  background: rgba(255, 92, 138, 0.14);
  color: #ffa6c0;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
}

.remove-btn:hover {
  background: rgba(255, 92, 138, 0.28);
}

/* MODO TABELA */
.list-table-wrap {
  width: 100%;
  overflow-x: auto;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--surface-light);
}

table.list-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 14px;
}

table.list-table thead {
  background: #171222;
  color: var(--muted);
  font-size: 12px;
  text-transform: uppercase;
}

table.list-table th,
table.list-table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

table.list-table tbody tr.clickable-row {
  cursor: pointer;
  transition: background 0.16s ease;
}

table.list-table tbody tr.clickable-row:hover {
  background: var(--surface-hover);
}

table.list-table tbody tr:last-child td {
  border-bottom: none;
}

.table-thumb {
  width: 42px;
  height: 60px;
  border-radius: 6px;
  object-fit: cover;
  display: block;
}

.table-title-text {
  color: #ffffff;
  font-weight: bold;
}

table.list-table tbody tr.clickable-row:hover .table-title-text {
  color: #ff9dd0;
  text-decoration: underline;
}


.checklist-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 15px;
  border-radius: 10px;
  border: 1px solid rgba(240, 91, 168, 0.55);
  background: linear-gradient(100deg, rgba(240, 91, 168, 0.25), rgba(168, 117, 245, 0.25));
  color: #ffffff;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s, border-color 0.15s;
}

.checklist-btn:hover {
  background: linear-gradient(100deg, var(--pink), var(--purple));
  border-color: transparent;
  transform: translateY(-1px);
}

.checklist-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(7, 4, 13, 0.88);
  backdrop-filter: blur(6px);
  z-index: 250;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-y: auto;
}

.checklist-modal {
  width: 100%;
  max-width: 740px;
  max-height: 92vh;
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid #6a4285;
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.85);
}

.checklist-modal-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.checklist-modal-top h3 {
  margin: 0;
  font-size: 18px;
  color: #ffffff;
}

.modal-close-btn {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-light);
  color: #ffffff;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
}

.modal-close-btn:hover {
  border-color: var(--pink);
}

.checklist-bg-picker {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--surface-light);
  border: 1px solid var(--border);
  font-size: 12.5px;
  color: var(--muted);
}

.checklist-bg-picker select {
  padding: 7px 11px;
  border-radius: 8px;
  border: 1px solid #533b6e;
  background: #140f20;
  color: #ffffff;
  font-size: 12.5px;
  max-width: 100%;
}

.checklist-preview-frame {
  width: 100%;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: #0d0914;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 240px;
}

.checklist-preview-frame img {
  display: block;
  width: 100%;
  height: auto;
}

.checklist-actions-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 16px;
}

.checklist-action-btn {
  flex: 1 1 170px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 16px;
  border-radius: 11px;
  border: 1px solid #4d3866;
  background: var(--surface-light);
  color: #ffffff;
  font-size: 13.5px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.15s, border-color 0.15s, background 0.15s;
}

.checklist-action-btn:hover {
  transform: translateY(-1px);
  border-color: var(--pink);
}

.checklist-action-btn.primary {
  background: linear-gradient(100deg, var(--pink), var(--purple));
  border-color: transparent;
}

.checklist-share-status {
  margin-top: 10px;
  font-size: 12.5px;
  color: #ff9dd0;
  min-height: 18px;
}

footer {
  text-align: center;
  padding: 22px;
  color: var(--muted);
  font-size: 13px;
}

[hidden] {
  display: none !important;
}

@media (max-width: 900px) {
  #list-container.view-cards {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 600px) {
  #list-container.view-cards {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  #list-container.view-list .drama-card {
    flex-direction: column;
    align-items: stretch;
  }
}
</style>
</head>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://jjybnidhwfimcdwygafk.supabase.co";
const SUPABASE_KEY = "sb_publishable_DyikY0WSJJ4apDc0_ZwfOw_x6LvfqM-";

const memoryStorage = new Map();
const safeStorage = {
  getItem: (key) => { try { return window.localStorage.getItem(key); } catch { return memoryStorage.get(key) ?? null; } },
  setItem: (key, value) => { try { window.localStorage.setItem(key, value); } catch { memoryStorage.set(key, value); } },
  removeItem: (key) => { try { window.localStorage.removeItem(key); } catch { memoryStorage.delete(key); } }
};

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { storage: safeStorage, persistSession: true, autoRefreshToken: true }
});

const params = new URLSearchParams(window.location.search);
let activeStatus = params.get("status") || "all";
let activeView = "cards";
let currentUser = null;
let myEntries = [];

const container = document.getElementById("list-container");

function goToDrama(dramaId) {
  window.location.href = "drama.html?id=" + encodeURIComponent(dramaId);
}

function attachKeyboardOpen(el, dramaId) {
  el.tabIndex = 0;
  el.setAttribute("role", "link");
  el.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      goToDrama(dramaId);
    }
  });
}

function buildRowControls(entry) {
  const wrap = document.createElement("div");
  wrap.className = "card-controls";

  // Impede que mexer no status ou remover abra a página do drama
  const stopBubble = (e) => e.stopPropagation();
  wrap.addEventListener("click", stopBubble);
  wrap.addEventListener("keydown", stopBubble);

  const select = document.createElement("select");
  select.className = "status-select";
  [
    { value: "want_to_watch", label: "♡ Quero assistir" },
    { value: "watching", label: "▶ Assistindo" },
    { value: "completed", label: "✓ Concluído" }
  ].forEach(opt => {
    const o = document.createElement("option");
    o.value = opt.value;
    o.textContent = opt.label;
    o.selected = entry.status === opt.value;
    select.appendChild(o);
  });

  select.addEventListener("change", async () => {
    const newStatus = select.value;
    const { error } = await db
      .from("user_drama_list")
      .update({ status: newStatus, updated_at: new Date().toISOString() })
      .eq("id", entry.id);

    if (!error) {
      entry.status = newStatus;
      renderMyList();
    }
  });

  const removeBtn = document.createElement("button");
  removeBtn.type = "button";
  removeBtn.className = "remove-btn";
  removeBtn.textContent = "Remover";

  removeBtn.addEventListener("click", async () => {
    const { error } = await db
      .from("user_drama_list")
      .delete()
      .eq("id", entry.id);

    if (!error) {
      myEntries = myEntries.filter(item => item.id !== entry.id);
      renderMyList();
    }
  });

  wrap.append(select, removeBtn);
  return wrap;
}

function renderMyList() {
  container.innerHTML = "";

  const filtered = activeStatus === "all"
    ? myEntries
    : myEntries.filter(item => item.status === activeStatus);

  if (!filtered.length) {
    container.className = "view-cards";
    const p = document.createElement("p");
    p.style.color = "var(--muted)";
    p.textContent = "Nenhum drama encontrado nesta categoria 🌷";
    container.appendChild(p);
    return;
  }

  // MODO TABELA: linha inteira clicável
  if (activeView === "table") {
    container.className = "";
    const wrap = document.createElement("div");
    wrap.className = "list-table-wrap";

    const table = document.createElement("table");
    table.className = "list-table";
    table.innerHTML = `
      <thead>
        <tr>
          <th>Capa</th>
          <th>Título</th>
          <th>Ano</th>
          <th>Situação na lista</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;

    const tbody = table.querySelector("tbody");

    filtered.forEach(entry => {
      const d = entry.dramas || {};
      const tr = document.createElement("tr");
      tr.className = "clickable-row";
      tr.title = `Abrir detalhes de ${d.title || "drama"}`;
      tr.addEventListener("click", () => goToDrama(entry.drama_id));
      attachKeyboardOpen(tr, entry.drama_id);

      const tdImg = document.createElement("td");
      if (d.poster_url) {
        const img = document.createElement("img");
        img.className = "table-thumb";
        img.src = d.poster_url;
        img.alt = d.title || "Capa";
        img.loading = "lazy";
        tdImg.appendChild(img);
      } else {
        tdImg.textContent = "🌷";
      }

      const tdTitle = document.createElement("td");
      const titleSpan = document.createElement("span");
      titleSpan.className = "table-title-text";
      titleSpan.textContent = d.title || "Sem título";
      tdTitle.appendChild(titleSpan);

      const tdYear = document.createElement("td");
      tdYear.textContent = d.year || "—";

      const tdActions = document.createElement("td");
      tdActions.appendChild(buildRowControls(entry));

      tr.append(tdImg, tdTitle, tdYear, tdActions);
      tbody.appendChild(tr);
    });

    wrap.appendChild(table);
    container.appendChild(wrap);
    return;
  }

  // MODOS CARDS E LISTA: card inteiro clicável
  container.className = activeView === "list" ? "view-list" : "view-cards";

  filtered.forEach(entry => {
    const d = entry.dramas || {};
    const card = document.createElement("article");
    card.className = "drama-card";
    card.title = `Abrir detalhes de ${d.title || "drama"}`;
    card.addEventListener("click", () => goToDrama(entry.drama_id));
    attachKeyboardOpen(card, entry.drama_id);

    const poster = document.createElement("img");
    poster.className = "drama-poster";
    poster.src = d.poster_url || "";
    poster.alt = d.title || "Drama";
    poster.loading = "lazy";
    poster.onerror = () => { poster.style.display = "none"; };

    const overlay = document.createElement("div");
    overlay.className = "drama-overlay";

    const h3 = document.createElement("h3");
    h3.className = "drama-title";
    h3.textContent = d.title || "Sem título";

    const meta = document.createElement("div");
    meta.className = "drama-meta";
    meta.textContent = [d.year, d.genre].filter(Boolean).join(" · ") || "GL";

    overlay.append(h3, meta);

    if (activeView === "cards") {
      overlay.appendChild(buildRowControls(entry));
      card.append(poster, overlay);
    } else {
      const left = document.createElement("div");
      left.className = "drama-left";
      left.append(poster, overlay);
      card.append(left, buildRowControls(entry));
    }

    container.appendChild(card);
  });
}

  if (!currentUser) {
    document.getElementById("not-logged").hidden = false;

const BADGE_DEFINITIONS = [
  { icon: "🌷", title: "Primeiros Passos", desc: "1º GL na lista", check: (s, c, p) => s.total >= 1 },
  { icon: "🎬", title: "Maratonista GL", desc: "5+ concluídos", check: (s, c, p) => s.completed >= 5 },
  { icon: "👑", title: "Rainha dos GLs", desc: "15+ concluídos", check: (s, c, p) => s.completed >= 15 },
  { icon: "📚", title: "Colecionadora", desc: "20+ na lista", check: (s, c, p) => s.total >= 20 },
  { icon: "💬", title: "Crítica da Comunidade", desc: "1+ avaliação", check: (s, c, p) => c >= 1 },
  { icon: "💕", title: "Shipper Oficial", desc: "Casal definido", check: (s, c, p) => Boolean((p?.favorite_ship || "").trim()) }
];

let checklistState = {
  displayName: "Fã do ThaiGList",
  allBadges: [],
  completedDramas: [],
  airingDramas: [],
  generatedDataUrl: null,
  generatedBlob: null
};

function getChecklistDramaCategory(item) {
  const rawStatus = (item.status || "").trim().toLowerCase();
  const year = Number(item.year) || 0;
  const totalEps = Number(item.episodes) || 0;

  if (rawStatus === "em andamento") {
    if (item.end_date) {
      const endTs = new Date(item.end_date + "T23:59:59").getTime();
      if (!Number.isNaN(endTs) && Date.now() > endTs) return "completed";
    }
    if (item.premiere_date && totalEps > 0) {
      const startTs = new Date(item.premiere_date + "T00:00:00").getTime();
      if (!Number.isNaN(startTs) && Date.now() >= startTs) {
        const weeks = Math.floor((Date.now() - startTs) / (7 * 24 * 60 * 60 * 1000)) + 1;
        if (weeks > totalEps) return "completed";
      }
    }
    return "airing";
  }

  if (
    rawStatus.includes("finaliz") ||
    rawStatus.includes("conclu") ||
    rawStatus.includes("complet") ||
    rawStatus.includes("encerrad") ||
    rawStatus.includes("lançad") ||
    rawStatus.includes("lancad") ||
    rawStatus.includes("exibid") ||
    rawStatus === "finished" ||
    rawStatus === "completed" ||
    rawStatus === "ended"
  ) {
    return "completed";
  }

  const isExplicitUpcoming =
    rawStatus.includes("teaser") ||
    rawStatus.includes("piloto") ||
    rawStatus.includes("breve") ||
    rawStatus.includes("previst") ||
    rawStatus.includes("anunciad") ||
    rawStatus.includes("upcoming") ||
    year > 2026;

  if (!isExplicitUpcoming && year > 0 && year <= 2026) {
    return "completed";
  }

  return "other";
}

function drawRoundedRect(ctx, x, y, w, h, r) {
  const radius = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + w, y, x + w, y + h, radius);
  ctx.arcTo(x + w, y + h, x, y + h, radius);
  ctx.arcTo(x, y + h, x, y, radius);
  ctx.arcTo(x, y, x + w, y, radius);
  ctx.closePath();
}

function truncateCanvasText(ctx, text, maxWidth) {
  let str = String(text || "");
  if (ctx.measureText(str).width <= maxWidth) return str;
  while (str.length > 1 && ctx.measureText(str + "…").width > maxWidth) {
    str = str.slice(0, -1);
  }
  return str + "…";
}

async function prepareChecklistData() {
  if (!currentUser) return;

  const [profRes, commentsRes, dramasRes] = await Promise.all([
    db.from("profiles").select("display_name, favorite_ship").eq("id", currentUser.id).maybeSingle(),
    db.from("drama_comments").select("id", { count: "exact", head: true }).eq("user_id", currentUser.id),
    db.from("dramas").select("id, title, year, status, episodes, premiere_date, end_date").order("title")
  ]);

  const prof = profRes.data || null;
  const commentsCount = commentsRes.count || 0;
  const allDramas = dramasRes.data || [];

  const stats = {
    total: myEntries.length,
    completed: myEntries.filter(r => r.status === "completed").length,
    watching: myEntries.filter(r => r.status === "watching").length,
    want: myEntries.filter(r => r.status === "want_to_watch").length
  };

  const allBadges = BADGE_DEFINITIONS.map(b => ({
    icon: b.icon,
    title: b.title,
    desc: b.desc,
    unlocked: b.check(stats, commentsCount, prof)
  }));

  const completedDramas = [];
  const airingDramas = [];

  allDramas.forEach(d => {
    const cat = getChecklistDramaCategory(d);
    if (cat === "completed") completedDramas.push(d);
    else if (cat === "airing") airingDramas.push(d);
  });

  checklistState.displayName =
    (prof?.display_name || "").trim() ||
    currentUser.user_metadata?.full_name ||
    currentUser.email?.split("@")[0] ||
    "Fã do ThaiGList";
  checklistState.allBadges = allBadges;
  checklistState.completedDramas = completedDramas;
  checklistState.airingDramas = airingDramas;
}

function getBlockHeight(itemCount) {
  const rowHeight = 25;
  const groupHeaderHeight = 36;
  return groupHeaderHeight + itemCount * rowHeight + 14;
}

function drawYearOrSectionBlock(ctx, xCol, cursorY, colWidth, grp, statusByDramaId, forcedHeight) {
  const rowHeight = 25;
  const groupHeaderHeight = 36;
  const naturalHeight = getBlockHeight(grp.items.length);
  const boxHeight = Math.max(naturalHeight, forcedHeight || 0);
  const isAiringBlock = Boolean(grp.isAiring);

  // Cartão branco bem claro com sombra suave para leitura nítida
  ctx.save();
  ctx.shadowColor = "rgba(95, 53, 138, 0.10)";
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 4;
  drawRoundedRect(ctx, xCol, cursorY, colWidth, boxHeight, 14);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
  ctx.restore();

  drawRoundedRect(ctx, xCol, cursorY, colWidth, boxHeight, 14);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = isAiringBlock ? "#f5a3ce" : "#dec7f5";
  ctx.stroke();

  // Cabeçalho do bloco
  drawRoundedRect(ctx, xCol, cursorY, colWidth, groupHeaderHeight, 14);
  const headerGrad = ctx.createLinearGradient(xCol, cursorY, xCol + colWidth, cursorY);
  if (isAiringBlock) {
    headerGrad.addColorStop(0, "#e64596");
    headerGrad.addColorStop(1, "#9b51e0");
  } else {
    headerGrad.addColorStop(0, "#b83b92");
    headerGrad.addColorStop(1, "#7d4bc4");
  }
  ctx.fillStyle = headerGrad;
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 15px Arial, sans-serif";
  const countText = grp.subLabel ? grp.subLabel : `(${grp.items.length})`;
  ctx.fillText(`${grp.label} ${countText}`, xCol + 14, cursorY + 23);

  let itemY = cursorY + groupHeaderHeight + 19;

  grp.items.forEach(item => {
    const userStatus = statusByDramaId.get(item.id);
    const isChecked = userStatus === "completed" || userStatus === "watching";
    const isCompleted = userStatus === "completed";

    const boxSize = 14;
    const boxX = xCol + 13;
    const boxY = itemY - 11;

    drawRoundedRect(ctx, boxX, boxY, boxSize, boxSize, 3.5);
    if (isCompleted) {
      ctx.fillStyle = "#e64596";
      ctx.fill();
      ctx.strokeStyle = "#e64596";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(boxX + 3, boxY + 7);
      ctx.lineTo(boxX + 6, boxY + 10.5);
      ctx.lineTo(boxX + 11.5, boxY + 3.5);
      ctx.stroke();
    } else if (isChecked) {
      ctx.fillStyle = "#8b5cf6";
      ctx.fill();
      ctx.strokeStyle = "#8b5cf6";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(boxX + 3, boxY + 7);
      ctx.lineTo(boxX + 6, boxY + 10.5);
      ctx.lineTo(boxX + 11.5, boxY + 3.5);
      ctx.stroke();
    } else {
      ctx.fillStyle = "#faf6ff";
      ctx.fill();
      ctx.strokeStyle = "#a589c4";
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }

    const maxTitleW = colWidth - 38 - (isAiringBlock ? 54 : 0);
    ctx.fillStyle = isChecked ? "#1d0c2e" : "#3a294d";
    ctx.font = (isChecked ? "bold " : "") + "13px Arial, sans-serif";
    const clippedTitle = truncateCanvasText(ctx, item.title || "Sem título", maxTitleW);
    ctx.fillText(clippedTitle, boxX + boxSize + 8, itemY);

    if (isAiringBlock) {
      const titleW = ctx.measureText(clippedTitle).width;
      ctx.fillStyle = "#e64596";
      ctx.font = "bold 10px Arial, sans-serif";
      ctx.fillText(" NO AR", boxX + boxSize + 10 + titleW, itemY);
    }

    itemY += rowHeight;
  });

  return boxHeight;
}

function buildBalancedColumns(yearBlocks, airingBlock, numCols) {
  // Se algum ano for muito longo comparado ao total, divide em partes (ex: "2024 (1/2)" e "2024 (2/2)")
  // para que as 3 colunas fiquem com alturas praticamente idênticas e sem espaços vazios
  const allRawBlocks = [...yearBlocks];
  if (airingBlock) allRawBlocks.push(airingBlock);

  const totalItems = allRawBlocks.reduce((acc, b) => acc + b.items.length, 0);
  const maxChunkSize = Math.max(12, Math.ceil(totalItems / numCols) + 2);

  const normalizedBlocks = [];
  allRawBlocks.forEach(blk => {
    if (blk.items.length <= maxChunkSize) {
      normalizedBlocks.push(blk);
    } else {
      const parts = Math.ceil(blk.items.length / maxChunkSize);
      const perPart = Math.ceil(blk.items.length / parts);
      for (let p = 0; p < parts; p++) {
        const slice = blk.items.slice(p * perPart, (p + 1) * perPart);
        if (slice.length) {
          normalizedBlocks.push({
            label: blk.label,
            subLabel: `(${p + 1}/${parts} • ${blk.items.length})`,
            items: slice,
            isAiring: blk.isAiring
          });
        }
      }
    }
  });

  // Distribui os blocos nas 3 colunas preservando a ordem cronológica e equilibrando as alturas
  const colGroups = Array.from({ length: numCols }, () => []);
  const colHeights = Array.from({ length: numCols }, () => 0);
  const gap = 16;

  normalizedBlocks.forEach(blk => {
    const h = getBlockHeight(blk.items.length);
    let bestCol = 0;
    for (let c = 1; c < numCols; c++) {
      if (colHeights[c] < colHeights[bestCol]) bestCol = c;
    }
    colGroups[bestCol].push(blk);
    colHeights[bestCol] += h + gap;
  });

  return colGroups;
}

async function renderChecklistCanvas() {
  const previewFrame = document.getElementById("checklist-preview-frame");
  const statusEl = document.getElementById("checklist-share-status");
  const showBadges = Boolean(document.getElementById("checklist-show-badges")?.checked);
  statusEl.textContent = "";

  const statusByDramaId = new Map();
  myEntries.forEach(e => statusByDramaId.set(e.drama_id, e.status));

  const completedList = checklistState.completedDramas;
  const airingList = checklistState.airingDramas;
  const eligible = [...completedList, ...airingList];

  const groupedByYear = new Map();
  completedList.forEach(item => {
    const yr = item.year ? String(item.year) : "Outros";
    if (!groupedByYear.has(yr)) groupedByYear.set(yr, []);
    groupedByYear.get(yr).push(item);
  });

  const sortedYears = [...groupedByYear.keys()].sort((a, b) => {
    const na = Number(a);
    const nb = Number(b);
    if (!Number.isNaN(na) && !Number.isNaN(nb)) return na - nb;
    return a.localeCompare(b, "pt-BR");
  });

  const yearBlocks = sortedYears.map(yr => ({
    label: yr,
    items: groupedByYear.get(yr),
    isAiring: false
  }));

  const airingBlock = airingList.length > 0
    ? { label: "📺 Em Exibição", items: airingList, isAiring: true }
    : null;

  const numCols = 3;
  const colGroups = buildBalancedColumns(yearBlocks, airingBlock, numCols);
  const groupGap = 16;

  const naturalColHeights = colGroups.map(groups => {
    if (!groups.length) return 180;
    return groups.reduce((sum, g, idx) => sum + getBlockHeight(g.items.length) + (idx > 0 ? groupGap : 0), 0);
  });

  const bodyHeight = Math.max(...naturalColHeights, 240);
  const canvasWidth = 1080;
  const topHeaderHeight = showBadges ? 256 : 150;
  const bottomFooterHeight = 118;
  const canvasHeight = topHeaderHeight + bodyHeight + bottomFooterHeight;

  const canvas = document.createElement("canvas");
  canvas.width = canvasWidth;
  canvas.height = canvasHeight;
  const ctx = canvas.getContext("2d");

  // Fundo bem claro e luminoso em tons suaves de lilás/rosa pastel (identidade ThaiGList)
  const brightBg = ctx.createLinearGradient(0, 0, canvasWidth, canvasHeight);
  brightBg.addColorStop(0, "#faf4ff");
  brightBg.addColorStop(0.5, "#f5ebff");
  brightBg.addColorStop(1, "#fdf2f8");
  ctx.fillStyle = brightBg;
  ctx.fillRect(0, 0, canvasWidth, canvasHeight);

  // Detalhes decorativos sutis no fundo claro
  const glowLeft = ctx.createRadialGradient(140, 120, 10, 140, 120, 340);
  glowLeft.addColorStop(0, "rgba(240, 91, 168, 0.10)");
  glowLeft.addColorStop(1, "rgba(240, 91, 168, 0)");
  ctx.fillStyle = glowLeft;
  ctx.fillRect(0, 0, canvasWidth, canvasHeight);

  const glowRight = ctx.createRadialGradient(canvasWidth - 140, canvasHeight - 160, 10, canvasWidth - 140, canvasHeight - 160, 360);
  glowRight.addColorStop(0, "rgba(168, 117, 245, 0.12)");
  glowRight.addColorStop(1, "rgba(168, 117, 245, 0)");
  ctx.fillStyle = glowRight;
  ctx.fillRect(0, 0, canvasWidth, canvasHeight);

  // Faixa superior em roxo e rosa
  const topBarGrad = ctx.createLinearGradient(0, 0, canvasWidth, 0);
  topBarGrad.addColorStop(0, "#f05ba8");
  topBarGrad.addColorStop(0.5, "#a875f5");
  topBarGrad.addColorStop(1, "#f05ba8");
  ctx.fillStyle = topBarGrad;
  ctx.fillRect(0, 0, canvasWidth, 12);

  // Cabeçalho escuro/contrastante sobre o fundo claro
  ctx.textAlign = "center";
  ctx.fillStyle = "#c92e7e";
  ctx.font = "bold 16px Arial, sans-serif";
  ctx.fillText("ThaiGList 🌷 • Checklist Oficial de GLs", canvasWidth / 2, 44);

  ctx.fillStyle = "#241138";
  ctx.font = "bold 38px Georgia, 'Times New Roman', serif";
  ctx.fillText(
    truncateCanvasText(ctx, `Checklist de ${checklistState.displayName}`, 980),
    canvasWidth / 2,
    88
  );

  const activeCount = eligible.filter(d => {
    const st = statusByDramaId.get(d.id);
    return st === "completed" || st === "watching";
  }).length;

  ctx.fillStyle = "#5c4575";
  ctx.font = "14.5px Arial, sans-serif";
  ctx.fillText(
    `Séries finalizadas e em exibição • ${activeCount} de ${eligible.length} marcadas como assistindo ou concluídas`,
    canvasWidth / 2,
    118
  );

  // Conquistas e badges (opcional via caixa de seleção)
  if (showBadges) {
    const badges = checklistState.allBadges;
    const badgeBoxY = 134;
    const badgeBoxH = 98;
    drawRoundedRect(ctx, 36, badgeBoxY, canvasWidth - 72, badgeBoxH, 14);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = "#dfc6f7";
    ctx.stroke();

    ctx.textAlign = "left";
    ctx.fillStyle = "#b82e78";
    ctx.font = "bold 12px Arial, sans-serif";
    const unlockedTotal = badges.filter(b => b.unlocked).length;
    ctx.fillText(`🏆 CONQUISTAS E BADGES (${unlockedTotal}/${badges.length} DESBLOQUEADOS)`, 54, badgeBoxY + 22);

    const badgeColW = (canvasWidth - 116) / 3;
    badges.forEach((b, idx) => {
      const col = idx % 3;
      const row = Math.floor(idx / 3);
      const bx = 54 + col * (badgeColW + 4);
      const by = badgeBoxY + 42 + row * 26;

      ctx.fillStyle = b.unlocked ? "#241138" : "#9c88b3";
      ctx.font = (b.unlocked ? "bold " : "") + "12.5px Arial, sans-serif";
      const lockMark = b.unlocked ? "✓ " : "🔒 ";
      ctx.fillText(
        truncateCanvasText(ctx, `${b.icon} ${b.title} (${lockMark}${b.desc})`, badgeColW - 8),
        bx,
        by
      );
    });
  }

  // Desenha as 3 colunas equilibradas e ajusta o último bloco de cada coluna para fechar alinhado no rodapé sem espaço vazio
  const marginX = 36;
  const colGap = 20;
  const colWidth = (canvasWidth - marginX * 2 - colGap * (numCols - 1)) / numCols;
  const colsStartY = topHeaderHeight;

  ctx.textAlign = "left";
  for (let c = 0; c < numCols; c++) {
    const xCol = marginX + c * (colWidth + colGap);
    let cursorY = colsStartY;
    const groups = colGroups[c];
    const remainingSlack = Math.max(0, bodyHeight - naturalColHeights[c]);

    groups.forEach((grp, idx) => {
      const isLastInCol = idx === groups.length - 1;
      const naturalH = getBlockHeight(grp.items.length);
      const targetH = isLastInCol ? naturalH + remainingSlack : naturalH;
      const drawnH = drawYearOrSectionBlock(ctx, xCol, cursorY, colWidth, grp, statusByDramaId, targetH);
      cursorY += drawnH + groupGap;
    });
  }

  // Rodapé convidando para thaiglist.pages.dev (sem imagem)
  const footerY = canvasHeight - bottomFooterHeight + 16;
  drawRoundedRect(ctx, marginX, footerY, canvasWidth - marginX * 2, 82, 16);
  const footerGrad = ctx.createLinearGradient(marginX, footerY, canvasWidth - marginX, footerY);
  footerGrad.addColorStop(0, "#d94391");
  footerGrad.addColorStop(0.55, "#9c5ce6");
  footerGrad.addColorStop(1, "#d94391");
  ctx.fillStyle = footerGrad;
  ctx.fill();

  ctx.textAlign = "center";
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 18px Arial, sans-serif";
  ctx.fillText("Faça o seu também! Acesse: thaiglist.pages.dev", canvasWidth / 2, footerY + 33);

  ctx.fillStyle = "#fff0f8";
  ctx.font = "13.5px Arial, sans-serif";
  ctx.fillText("Monte sua lista de Thai GLs, acompanhe lançamentos e compartilhe com suas amigas 🌷", canvasWidth / 2, footerY + 59);

  const dataUrl = canvas.toDataURL("image/png");
  checklistState.generatedDataUrl = dataUrl;
  canvas.toBlob(blob => {
    checklistState.generatedBlob = blob;
  }, "image/png");

  previewFrame.innerHTML = "";
  const img = document.createElement("img");
  img.src = dataUrl;
  img.alt = `Checklist de ${checklistState.displayName}`;
  previewFrame.appendChild(img);
}

const shareTweetText = encodeURIComponent(
  "Olha o meu checklist de Thai GLs no ThaiGList! Faça o seu também, acesse: https://thaiglist.pages.dev 🌷"
);
shareXLink.href = `https://twitter.com/intent/tweet?text=${shareTweetText}`;

shareChecklistBtn.addEventListener("click", async () => {
  checklistShareStatus.textContent = "";
  const sharePayloadText = "Faça o seu também! Acesse: https://thaiglist.pages.dev 🌷";

  try {
    if (
      navigator.share &&
      checklistState.generatedBlob &&
      typeof File !== "undefined"
    ) {
      const file = new File([checklistState.generatedBlob], "checklist-thaiglist.png", {
        type: "image/png"
      });
      if (!navigator.canShare || navigator.canShare({ files: [file] })) {
        await navigator.share({
          title: "Meu Checklist ThaiGList",
          text: sharePayloadText,
          files: [file]
        });
        checklistShareStatus.textContent = "Checklist compartilhado com sucesso! 🌷";
        return;
      }
    }
  } catch (err) {
    if (err && err.name === "AbortError") return;
  }

  try {
    await navigator.clipboard.writeText(sharePayloadText);
    checklistShareStatus.textContent = "Convite copiado! Baixe a imagem acima para anexar onde quiser 🌷";
  } catch {
    checklistShareStatus.textContent = "Baixe a imagem pelo botão ao lado ou use o botão Postar no X 🌷";
  }
});

shareIgBtn.addEventListener("click", async () => {
  checklistShareStatus.textContent = "";
  const igCaption = "Meu checklist de Thai GLs no ThaiGList! Faça o seu também, acesse: https://thaiglist.pages.dev 🌷 #ThaiGL #GL #ThaiGList";

  try {
    await navigator.clipboard.writeText(igCaption);
  } catch {}

  try {
    if (
      navigator.share &&
      checklistState.generatedBlob &&
      typeof File !== "undefined"
    ) {
      const file = new File([checklistState.generatedBlob], "checklist-thaiglist.png", {
        type: "image/png"
      });
      if (!navigator.canShare || navigator.canShare({ files: [file] })) {
        await navigator.share({
          title: "Meu Checklist ThaiGList",
          text: igCaption,
          files: [file]
        });
        checklistShareStatus.textContent = "Compartilhado! Legenda copiada caso queira colar no Instagram 🌷";
        return;
      }
    }
  } catch (err) {
    if (err && err.name === "AbortError") return;
  }

  if (checklistState.generatedDataUrl) {
    const link = document.createElement("a");
    const slug = (checklistState.displayName || "thaiglist")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-|-$/g, "");
    link.download = `checklist-${slug || "thaiglist"}.png`;
    link.href = checklistState.generatedDataUrl;
    link.click();
  }

  window.open("https://www.instagram.com/", "_blank", "noopener,noreferrer");
  checklistShareStatus.textContent = "Imagem baixada e legenda copiada! Agora é só publicar no Instagram 🌷";
});

db.auth.onAuthStateChange((event, session) => {
  if ((event === "SIGNED_IN" || event === "TOKEN_REFRESHED" || event === "INITIAL_SESSION") && session?.user) {
    if (!currentUser || currentUser.id !== session.user.id) {
      loadMyList();
    }
  }
});

loadMyList();
</script>
